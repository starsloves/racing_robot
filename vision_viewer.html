<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>竞速机器人视觉 - 实时监控（双画面）</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            background: #1a1a1a;
            color: #ffffff;
            font-family: 'Segoe UI', Arial, sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 16px;
            min-height: 100vh;
        }
        .header { text-align: center; margin-bottom: 10px; }
        h1 { color: #00ff00; font-size: 1.6em; margin-bottom: 6px; }
        .status-bar {
            display: flex;
            gap: 16px;
            justify-content: center;
            flex-wrap: wrap;
            margin: 8px 0 12px;
        }
        .stage-badge {
            display: inline-flex;
            align-items: center;
            gap: 6px;
            padding: 6px 12px;
            border-radius: 16px;
            font-size: 0.85em;
            font-weight: bold;
            border: 1px solid #444;
            background: #2a2a2a;
        }
        .stage-badge .dot {
            width: 10px; height: 10px;
            border-radius: 50%;
            display: inline-block;
        }
        .dot.live { background: #00ff00; box-shadow: 0 0 6px #00ff00; }
        .dot.stale { background: #ff9900; animation: pulse 1.5s infinite; }
        .dot.offline { background: #ff4444; }
        .dot.connecting { background: #ff9900; animation: pulse 1s infinite; }
        @keyframes pulse {
            0%, 100% { opacity: 1; }
            50% { opacity: 0.4; }
        }

        .dual-container {
            display: flex;
            gap: 12px;
            width: 100%;
            max-width: 1800px;
            flex-wrap: wrap;
            justify-content: center;
        }
        .pane {
            flex: 1 1 400px;
            min-width: 300px;
            max-width: 880px;
            border-radius: 8px;
            overflow: hidden;
            background: #000;
        }
        .pane-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 6px 12px;
            font-size: 0.85em;
            font-weight: bold;
        }
        .pane-header .name { color: #ccc; }
        .pane-header .frames { color: #888; font-weight: normal; font-size: 0.85em; }
        .pane-header .age { font-size: 0.85em; }
        .pane-header .age.fresh { color: #00ff00; }
        .pane-header .age.stale { color: #ff9900; }
        .pane-header .age.offline { color: #ff4444; }
        .pane.live { border: 3px solid #00ff00; box-shadow: 0 0 16px rgba(0,255,0,0.25); }
        .pane.stale { border: 3px solid #ff9900; box-shadow: 0 0 16px rgba(255,153,0,0.25); }
        .pane.offline { border: 3px solid #ff4444; box-shadow: 0 0 16px rgba(255,68,68,0.25); }
        .pane.connecting { border: 3px solid #ff9900; }
        .pane-image {
            display: block;
            width: 100%;
            height: auto;
            transition: opacity 0.2s ease;
        }
        .pane-loading {
            position: absolute;
            top: 0; left: 0; right: 0; bottom: 0;
            background: rgba(0,0,0,0.85);
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            font-size: 1.2em;
            color: #00ff00;
        }
        .pane-loading small {
            font-size: 0.6em;
            margin-top: 8px;
            color: #888;
        }
        .pane-image-wrap {
            position: relative;
        }

        .info-panel {
            margin-top: 14px;
            padding: 14px 18px;
            background: #2a2a2a;
            border-radius: 8px;
            max-width: 900px;
            width: 100%;
        }
        .info-row {
            display: flex;
            justify-content: space-between;
            padding: 6px 0;
            border-bottom: 1px solid #444;
            gap: 12px;
        }
        .info-row:last-child { border-bottom: none; }
        .info-label { color: #888; }
        .info-value { color: #00ff00; font-weight: bold; text-align: right; }
        .error-message {
            color: #ff4444;
            padding: 8px;
            background: #3a1a1a;
            border-radius: 4px;
            margin-top: 8px;
        }

        @media (max-width: 720px) {
            .pane { min-width: 100%; }
        }
    </style>
</head>
<body>
    <div class="header">
        <h1>竞速机器人视觉 · 双画面监控</h1>
        <div class="status-bar">
            <span class="stage-badge" id="badge-stage2">
                <span class="dot connecting" id="dot-stage2"></span>
                Stage2 · 8082 · <span id="s2-status">检测中</span>
            </span>
            <span class="stage-badge" id="badge-stage3">
                <span class="dot connecting" id="dot-stage3"></span>
                Stage3 · 8083 · <span id="s3-status">检测中</span>
            </span>
        </div>
    </div>

    <div class="dual-container">
        <div class="pane connecting" id="pane-stage2">
            <div class="pane-header" id="pane-header-stage2">
                <span class="name">Stage 2 · 车道居中</span>
                <span class="age" id="age-stage2">-</span>
                <span class="frames" id="frames-stage2">0</span>
            </div>
            <div class="pane-image-wrap">
                <img class="pane-image" id="img-stage2" src="" alt="Stage2 视觉">
                <div class="pane-loading" id="loading-stage2">
                    <div>正在连接 8082...</div>
                </div>
            </div>
        </div>

        <div class="pane connecting" id="pane-stage3">
            <div class="pane-header" id="pane-header-stage3">
                <span class="name">Stage 3 · P点检测</span>
                <span class="age" id="age-stage3">-</span>
                <span class="frames" id="frames-stage3">0</span>
            </div>
            <div class="pane-image-wrap">
                <img class="pane-image" id="img-stage3" src="" alt="Stage3 视觉">
                <div class="pane-loading" id="loading-stage3">
                    <div>正在连接 8083...</div>
                </div>
            </div>
        </div>
    </div>

    <div class="info-panel">
        <div class="info-row">
            <span class="info-label">Stage2 帧</span>
            <span class="info-value" id="s2-client-frames">0</span>
        </div>
        <div class="info-row">
            <span class="info-label">Stage3 帧</span>
            <span class="info-value" id="s3-client-frames">0</span>
        </div>
        <div class="info-row">
            <span class="info-label">服务端帧</span>
            <span class="info-value" id="server-frames">S2: - | S3: -</span>
        </div>
        <div class="info-row">
            <span class="info-label">轮询</span>
            <span class="info-value" id="poll-info">初始化...</span>
        </div>
        <div id="message-container"></div>
    </div>

    <script>
        const HOST = '100.114.34.86';
        const STAGES = {
            stage2: { name: 'Stage2', port: 8082, desc: '车道居中', key: 'stage2' },
            stage3: { name: 'Stage3', port: 8083, desc: 'P点检测', key: 'stage3' }
        };

        let healthPollCount = 0;
        let lastHealthPollTime = Date.now();

        let clientFrames = { stage2: 0, stage3: 0 };
        let stageHealth = {
            stage2: { alive: false, age: -1, frames: 0, uptime: 0, lastOk: 0 },
            stage3: { alive: false, age: -1, frames: 0, uptime: 0, lastOk: 0 }
        };

        // DOM refs
        const imgs = {
            stage2: document.getElementById('img-stage2'),
            stage3: document.getElementById('img-stage3')
        };
        const loadings = {
            stage2: document.getElementById('loading-stage2'),
            stage3: document.getElementById('loading-stage3')
        };
        const panes = {
            stage2: document.getElementById('pane-stage2'),
            stage3: document.getElementById('pane-stage3')
        };
        const ageSpans = {
            stage2: document.getElementById('age-stage2'),
            stage3: document.getElementById('age-stage3')
        };
        const framesSpans = {
            stage2: document.getElementById('frames-stage2'),
            stage3: document.getElementById('frames-stage3')
        };
        const dots = {
            stage2: document.getElementById('dot-stage2'),
            stage3: document.getElementById('dot-stage3')
        };
        const statusTexts = {
            stage2: document.getElementById('s2-status'),
            stage3: document.getElementById('s3-status')
        };

        const serverFramesSpan = document.getElementById('server-frames');
        const pollInfoSpan = document.getElementById('poll-info');
        const messageContainer = document.getElementById('message-container');

        function stageBase(key) {
            return `http://${HOST}:${STAGES[key].port}`;
        }

        function showMessage(msg) {
            messageContainer.innerHTML = `<div class="error-message">${msg}</div>`;
        }

        function clearMessage() {
            messageContainer.innerHTML = '';
        }

        function updatePane(key) {
            const h = stageHealth[key];
            const pane = panes[key];
            const dot = dots[key];
            const loading = loadings[key];
            const ageSpan = ageSpans[key];
            const framesSpan = framesSpans[key];
            const statusText = statusTexts[key];

            pane.classList.remove('live', 'stale', 'offline', 'connecting');
            dot.className = 'dot';
            let label = '';

            if (!h.alive) {
                pane.classList.add('offline');
                dot.classList.add('offline');
                ageSpan.className = 'age offline';
                ageSpan.textContent = '离线';
                loading.style.display = 'flex';
                loading.innerHTML = '<div>服务离线<small>无法连接到服务端</small></div>';
                label = '离线';
            } else if (h.age < 0) {
                pane.classList.add('connecting');
                dot.classList.add('connecting');
                ageSpan.className = 'age stale';
                ageSpan.textContent = '等待数据';
                loading.style.display = 'flex';
                loading.innerHTML = '<div>等待相机数据<small>服务已启动，等待第一帧</small></div>';
                label = '等待';
            } else if (h.age < 2) {
                pane.classList.add('live');
                dot.classList.add('live');
                ageSpan.className = 'age fresh';
                ageSpan.textContent = h.age.toFixed(2) + 's';
                loading.style.display = 'none';
                label = 'LIVE';
            } else {
                pane.classList.add('stale');
                dot.classList.add('stale');
                ageSpan.className = 'age stale';
                ageSpan.textContent = h.age.toFixed(1) + 's (过期)';
                loading.style.display = 'flex';
                loading.innerHTML = '<div>流已停止<small>图像过期，可能节点已停止</small></div>';
                label = '过期';
            }

            statusText.textContent = label;
            framesSpan.textContent = String(h.frames);
        }

        function updateBothPanes() {
            for (const key of ['stage2', 'stage3']) {
                updatePane(key);
            }
            serverFramesSpan.textContent =
                `S2: ${stageHealth.stage2.frames} | S3: ${stageHealth.stage3.frames}`;
        }

        async function pollOneHealth(key) {
            const controller = new AbortController();
            const timeoutId = setTimeout(() => controller.abort(), 3000);
            try {
                const res = await fetch(`${stageBase(key)}/health?_t=${Date.now()}`, {
                    method: 'GET',
                    cache: 'no-store',
                    signal: controller.signal
                });
                clearTimeout(timeoutId);
                if (!res.ok) throw new Error(`HTTP ${res.status}`);
                const data = await res.json();
                stageHealth[key] = {
                    alive: true,
                    age: (data.frame_age_sec === null || data.frame_age_sec === undefined) ? -1 : Number(data.frame_age_sec),
                    frames: Number(data.frame_count || 0),
                    uptime: Number(data.uptime_sec || 0),
                    lastOk: Date.now()
                };
                clearMessage();
            } catch (e) {
                clearTimeout(timeoutId);
                stageHealth[key] = {
                    alive: false,
                    age: -1,
                    frames: stageHealth[key].frames || 0,
                    uptime: 0,
                    lastOk: stageHealth[key].lastOk || 0
                };
                showMessage(`无法连接 ${STAGES[key].name} (${stageBase(key)})`);
            }
        }

        async function pollHealth() {
            const now = Date.now();
            const elapsed = now - lastHealthPollTime;
            lastHealthPollTime = now;
            healthPollCount++;

            await Promise.all([
                pollOneHealth('stage2'),
                pollOneHealth('stage3')
            ]);

            updateBothPanes();

            pollInfoSpan.textContent = `健康检查 #${healthPollCount} | 间隔 ${elapsed}ms`;
            setTimeout(pollHealth, 1000);
        }

        function refreshOneImage(key) {
            imgs[key].src = `${stageBase(key)}/vision_latest.jpg?t=${Date.now()}`;
        }

        function refreshStage2() {
            if (stageHealth.stage2.alive && stageHealth.stage2.age >= 0) {
                refreshOneImage('stage2');
            }
            setTimeout(refreshStage2, 120);
        }

        function refreshStage3() {
            if (stageHealth.stage3.alive && stageHealth.stage3.age >= 0) {
                refreshOneImage('stage3');
            }
            setTimeout(refreshStage3, 120);
        }

        // Image load success
        imgs.stage2.onload = function() {
            clientFrames.stage2++;
            document.getElementById('s2-client-frames').textContent = clientFrames.stage2;
        };
        imgs.stage3.onload = function() {
            clientFrames.stage3++;
            document.getElementById('s3-client-frames').textContent = clientFrames.stage3;
        };

        // Start
        pollHealth();
        refreshStage2();
        refreshStage3();
    </script>
</body>
</html>
