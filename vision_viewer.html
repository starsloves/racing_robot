<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>竞速机器人视觉 - 实时监控</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            background: #1a1a1a;
            color: #ffffff;
            font-family: 'Segoe UI', Arial, sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 20px;
            min-height: 100vh;
        }
        .header { text-align: center; margin-bottom: 16px; }
        h1 { color: #00ff00; font-size: 2em; margin-bottom: 10px; }
        .status {
            display: inline-block;
            padding: 8px 16px;
            background: #00ff00;
            color: #000;
            border-radius: 20px;
            font-weight: bold;
            font-size: 0.9em;
        }
        .status.connecting { background: #ff9900; animation: pulse 1.5s infinite; }
        .status.ready { background: #ffcc00; }
        .status.live { background: #00ff00; }
        .status.stale { background: #ff9900; animation: pulse 2s infinite; }
        .status.offline { background: #ff4444; }
        @keyframes pulse {
            0%, 100% { opacity: 1; }
            50% { opacity: 0.6; }
        }
        .stage-row {
            display: flex;
            gap: 10px;
            flex-wrap: wrap;
            justify-content: center;
            margin: 12px 0 16px;
        }
        .stage-btn {
            border: 1px solid #444;
            background: #2a2a2a;
            color: #ccc;
            border-radius: 18px;
            padding: 8px 14px;
            cursor: pointer;
            font-size: 0.9em;
        }
        .stage-btn.active {
            border-color: #00ff00;
            color: #00ff00;
            box-shadow: 0 0 10px rgba(0,255,0,0.25);
        }
        .stage-btn.alive { color: #8f8; }
        .stage-btn.stale { color: #fc6; }
        .stage-btn.offline { color: #f88; }
        .auto-switch {
            display: flex;
            align-items: center;
            gap: 8px;
            color: #aaa;
            font-size: 0.9em;
        }
        .image-container {
            position: relative;
            max-width: 100%;
            background: #000;
            border: 3px solid #00ff00;
            border-radius: 8px;
            overflow: hidden;
            box-shadow: 0 0 20px rgba(0, 255, 0, 0.3);
        }
        .image-container.stale {
            border-color: #ff9900;
            box-shadow: 0 0 20px rgba(255, 153, 0, 0.3);
        }
        .image-container.offline {
            border-color: #ff4444;
            box-shadow: 0 0 20px rgba(255, 68, 68, 0.3);
        }
        #vision-image {
            display: block;
            width: 100%;
            height: auto;
            max-width: 1600px;
            transition: opacity 0.25s ease;
        }
        .loading-overlay {
            position: absolute;
            top: 0; left: 0; right: 0; bottom: 0;
            background: rgba(0, 0, 0, 0.85);
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            font-size: 1.5em;
            color: #00ff00;
        }
        .loading-overlay small {
            font-size: 0.6em;
            margin-top: 10px;
            color: #888;
        }
        .info-panel {
            margin-top: 20px;
            padding: 20px;
            background: #2a2a2a;
            border-radius: 8px;
            max-width: 900px;
            width: 100%;
        }
        .info-row {
            display: flex;
            justify-content: space-between;
            padding: 8px 0;
            border-bottom: 1px solid #444;
            gap: 12px;
        }
        .info-row:last-child { border-bottom: none; }
        .info-label { color: #888; }
        .info-value { color: #00ff00; font-weight: bold; text-align: right; }
        .error-message {
            color: #ff4444;
            padding: 10px;
            background: #3a1a1a;
            border-radius: 4px;
            margin-top: 10px;
        }
        .hint-message {
            color: #ff9900;
            padding: 10px;
            background: #3a2a1a;
            border-radius: 4px;
            margin-top: 10px;
        }
    </style>
</head>
<body>
    <div class="header">
        <h1>🚗 竞速机器人视觉 - 实时监控</h1>
        <div class="status connecting" id="status">● CONNECTING</div>
    </div>

    <div class="stage-row">
        <button class="stage-btn offline" id="btn-stage2" onclick="manualSelectStage('stage2')">Stage2 · 8082</button>
        <button class="stage-btn offline" id="btn-stage3" onclick="manualSelectStage('stage3')">Stage3 · 8083</button>
        <label class="auto-switch">
            <input type="checkbox" id="auto-switch" checked>
            自动切换
        </label>
    </div>

    <div class="image-container" id="container">
        <img id="vision-image" src="" alt="视觉处理画面">
        <div class="loading-overlay" id="loading">
            <div>正在连接...</div>
        </div>
    </div>

    <div class="info-panel">
        <div class="info-row">
            <span class="info-label">当前源</span>
            <span class="info-value" id="current-source">Stage2 · http://100.114.34.86:8082</span>
        </div>
        <div class="info-row">
            <span class="info-label">服务状态</span>
            <span class="info-value" id="uptime">-</span>
        </div>
        <div class="info-row">
            <span class="info-label">当前阶段</span>
            <span class="info-value" id="phase">Stage2</span>
        </div>
        <div class="info-row">
            <span class="info-label">总帧数</span>
            <span class="info-value" id="server-frames">-</span>
        </div>
        <div class="info-row">
            <span class="info-label">最后一帧时长</span>
            <span class="info-value" id="frame-age">-</span>
        </div>
        <div class="info-row">
            <span class="info-label">已接收帧数</span>
            <span class="info-value" id="client-frames">0</span>
        </div>
        <div class="info-row">
            <span class="info-label">轮询状态</span>
            <span class="info-value" id="poll-status">初始化...</span>
        </div>
        <div class="info-row">
            <span class="info-label">Stage2/Stage3</span>
            <span class="info-value" id="stage-summary">检测中...</span>
        </div>
        <div id="message-container"></div>
    </div>

    <script>
        const HOST = '100.114.34.86';
        const STAGES = {
            stage2: { name: 'Stage2', port: 8082, desc: '车道居中' },
            stage3: { name: 'Stage3', port: 8083, desc: 'P点检测' }
        };

        let currentStage = 'stage2';
        let autoSwitch = true;
        let currentState = 'CONNECTING';
        let clientFrameCount = 0;
        let healthPollCount = 0;
        let imagePollCount = 0;
        let lastHealthPollTime = Date.now();
        let lastImagePollTime = Date.now();
        let stageHealth = {
            stage2: { alive: false, age: -1, frames: 0, uptime: 0, lastOk: 0 },
            stage3: { alive: false, age: -1, frames: 0, uptime: 0, lastOk: 0 }
        };

        const img = document.getElementById('vision-image');
        const loading = document.getElementById('loading');
        const status = document.getElementById('status');
        const container = document.getElementById('container');
        const messageContainer = document.getElementById('message-container');
        const uptimeSpan = document.getElementById('uptime');
        const phaseSpan = document.getElementById('phase');
        const serverFramesSpan = document.getElementById('server-frames');
        const frameAgeSpan = document.getElementById('frame-age');
        const clientFramesSpan = document.getElementById('client-frames');
        const pollStatusSpan = document.getElementById('poll-status');
        const currentSourceSpan = document.getElementById('current-source');
        const stageSummarySpan = document.getElementById('stage-summary');
        const autoSwitchCheckbox = document.getElementById('auto-switch');

        function stageBase(stageKey) {
            return `http://${HOST}:${STAGES[stageKey].port}`;
        }

        function updateSourceLabel() {
            const s = STAGES[currentStage];
            currentSourceSpan.textContent = `${s.name} · ${stageBase(currentStage)}`;
            phaseSpan.textContent = `${s.name} · ${s.desc}`;
            document.getElementById('btn-stage2').classList.toggle('active', currentStage === 'stage2');
            document.getElementById('btn-stage3').classList.toggle('active', currentStage === 'stage3');
        }

        function setState(newState) {
            if (currentState === newState) return;
            currentState = newState;
            status.className = 'status ' + newState.toLowerCase();
            container.className = 'image-container ' + (newState === 'STALE' ? 'stale' : newState === 'OFFLINE' ? 'offline' : '');
            const stateTexts = {
                OFFLINE: '● OFFLINE',
                CONNECTING: '● CONNECTING',
                READY: '● READY',
                LIVE: '● LIVE',
                STALE: '● STALE'
            };
            status.textContent = stateTexts[newState];
        }

        function showMessage(msg, type = 'error') {
            const className = type === 'hint' ? 'hint-message' : 'error-message';
            messageContainer.innerHTML = `<div class="${className}">${msg}</div>`;
        }

        function clearMessage() {
            messageContainer.innerHTML = '';
        }

        function updateStageButtons() {
            for (const key of Object.keys(STAGES)) {
                const btn = document.getElementById(`btn-${key}`);
                const h = stageHealth[key];
                btn.classList.remove('alive', 'stale', 'offline');
                if (!h.alive) btn.classList.add('offline');
                else if (h.age >= 0 && h.age < 2) btn.classList.add('alive');
                else btn.classList.add('stale');
            }
            const s2 = stageHealth.stage2;
            const s3 = stageHealth.stage3;
            stageSummarySpan.textContent =
                `S2 ${s2.alive ? (s2.age < 2 ? 'LIVE' : 'STALE') : 'OFF'} ` +
                `(${s2.frames}) | S3 ${s3.alive ? (s3.age < 2 ? 'LIVE' : 'STALE') : 'OFF'} (${s3.frames})`;
        }

        function scoreStage(key) {
            const h = stageHealth[key];
            if (!h.alive) return -1;
            if (h.age >= 0 && h.age < 2) return 1000 - h.age + (key === 'stage3' ? 10 : 0);
            if (h.age >= 0 && h.age < 5) return 100 - h.age;
            return 1;
        }

        function maybeAutoSwitch() {
            if (!autoSwitch) return;
            const preferred = (scoreStage('stage3') >= scoreStage('stage2')) ? 'stage3' : 'stage2';
            if (scoreStage(preferred) < 0) return;
            if (preferred !== currentStage && scoreStage(preferred) > scoreStage(currentStage)) {
                switchStage(preferred, false);
            }
        }

        function switchStage(stageKey, isManual) {
            if (!STAGES[stageKey] || stageKey === currentStage) {
                if (isManual) autoSwitch = false, autoSwitchCheckbox.checked = false;
                return;
            }
            if (isManual) {
                autoSwitch = false;
                autoSwitchCheckbox.checked = false;
            }
            img.style.opacity = '0.35';
            currentStage = stageKey;
            updateSourceLabel();
            // 立即用新端口刷新一次
            img.src = `${stageBase(currentStage)}/vision_latest.jpg?t=${Date.now()}`;
            setTimeout(() => { img.style.opacity = '1'; }, 180);
        }

        function manualSelectStage(stageKey) {
            switchStage(stageKey, true);
        }

        autoSwitchCheckbox.addEventListener('change', () => {
            autoSwitch = autoSwitchCheckbox.checked;
            if (autoSwitch) maybeAutoSwitch();
        });

        async function pollOneHealth(stageKey) {
            const controller = new AbortController();
            const timeoutId = setTimeout(() => controller.abort(), 3000);
            try {
                const res = await fetch(`${stageBase(stageKey)}/health?_t=${Date.now()}`, {
                    method: 'GET',
                    cache: 'no-store',
                    signal: controller.signal
                });
                clearTimeout(timeoutId);
                if (!res.ok) throw new Error(`HTTP ${res.status}`);
                const data = await res.json();
                stageHealth[stageKey] = {
                    alive: true,
                    age: (data.frame_age_sec === null || data.frame_age_sec === undefined) ? -1 : Number(data.frame_age_sec),
                    frames: Number(data.frame_count || 0),
                    uptime: Number(data.uptime_sec || 0),
                    lastOk: Date.now()
                };
            } catch (e) {
                clearTimeout(timeoutId);
                stageHealth[stageKey] = {
                    alive: false,
                    age: -1,
                    frames: stageHealth[stageKey].frames || 0,
                    uptime: 0,
                    lastOk: stageHealth[stageKey].lastOk || 0
                };
            }
        }

        function applyCurrentStageHealth() {
            const h = stageHealth[currentStage];
            if (!h.alive) {
                setState('OFFLINE');
                loading.style.display = 'flex';
                loading.innerHTML = '<div>服务离线<small>无法连接到当前阶段服务器</small></div>';
                uptimeSpan.textContent = '离线';
                serverFramesSpan.textContent = '-';
                frameAgeSpan.textContent = '-';
                showMessage(
                    `网络错误：当前源 ${STAGES[currentStage].name} 端口 ${STAGES[currentStage].port} 不可用。<br>` +
                    `请确认 Stage2(8082) / Stage3(8083) 是否启动，以及 Tailscale 连接。`
                );
                return;
            }

            uptimeSpan.textContent = `${h.uptime.toFixed(1)}s`;
            serverFramesSpan.textContent = String(h.frames);
            const frameAge = h.age;

            if (frameAge < 0) {
                setState('READY');
                loading.style.display = 'flex';
                loading.innerHTML = '<div>等待相机数据...<small>服务已启动，等待第一帧图像</small></div>';
                frameAgeSpan.textContent = '无数据';
                clearMessage();
            } else if (frameAge < 2) {
                setState('LIVE');
                loading.style.display = 'none';
                frameAgeSpan.textContent = `${frameAge.toFixed(2)}s（活跃）`;
                clearMessage();
            } else {
                setState('STALE');
                loading.style.display = 'flex';
                loading.innerHTML = '<div>流已停止<small>图像过期，可能节点已停止</small></div>';
                frameAgeSpan.textContent = `${frameAge.toFixed(1)}s（过期）`;
                showMessage('图像流已停止，请检查板端是否运行', 'hint');
            }
        }

        // ═══════════════════════════════════════════════════════
        // 健康检查轮询（每 1s）—— 保留原逻辑，扩展为双端口
        // ═══════════════════════════════════════════════════════
        async function pollHealth() {
            const now = Date.now();
            const elapsed = now - lastHealthPollTime;
            lastHealthPollTime = now;
            healthPollCount++;

            await Promise.all([
                pollOneHealth('stage2'),
                pollOneHealth('stage3')
            ]);

            updateStageButtons();
            maybeAutoSwitch();
            applyCurrentStageHealth();

            pollStatusSpan.textContent =
                `健康 #${healthPollCount} | 当前 ${STAGES[currentStage].name}:${STAGES[currentStage].port} | 间隔 ${elapsed}ms`;
            pollStatusSpan.style.color = stageHealth[currentStage].alive ? '#00ff00' : '#ff4444';

            setTimeout(pollHealth, 1000);
        }

        // ═══════════════════════════════════════════════════════
        // 图片刷新轮询（保持原有 100ms 逻辑）
        // ═══════════════════════════════════════════════════════
        function refreshImage() {
            imagePollCount++;
            lastImagePollTime = Date.now();

            if (currentState !== 'LIVE' && currentState !== 'READY') {
                setTimeout(refreshImage, 100);
                return;
            }

            // 兼容 /vision_latest.jpg 与 /image
            img.src = `${stageBase(currentStage)}/vision_latest.jpg?t=${Date.now()}`;
            pollStatusSpan.textContent =
                `健康 #${healthPollCount} | 图像 #${imagePollCount} | ${STAGES[currentStage].name}:${STAGES[currentStage].port}`;
            setTimeout(refreshImage, 100);
        }

        img.onload = function() {
            clientFrameCount++;
            clientFramesSpan.textContent = clientFrameCount;
            img.style.opacity = '1';
        };
        img.onerror = function() {};

        updateSourceLabel();
        pollHealth();
        refreshImage();
    </script>
</body>
</html>
