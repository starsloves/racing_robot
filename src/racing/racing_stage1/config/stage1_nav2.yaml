# S1 Nav2 chain: /scan -> costmaps -> Smac Hybrid-A* -> MPPI -> /cmd_vel.
# map_server/AMCL are intentionally absent: the shared start-corner localizer
# is the only map->odom_combined publisher in the competition process.

controller_server:
  ros__parameters:
    use_sim_time: false
    controller_frequency: 10.0
    robot_base_frame: base_link
    min_x_velocity_threshold: 0.0
    min_y_velocity_threshold: 0.0
    min_theta_velocity_threshold: 0.0
    odom_topic: /odom_combined
    progress_checker_plugins: [progress_checker]
    goal_checker_plugins: [goal_checker]
    controller_plugins: [FollowPath]
    progress_checker:
      plugin: nav2_controller::SimpleProgressChecker
      required_movement_radius: 0.10
      movement_time_allowance: 10.0
    goal_checker:
      plugin: nav2_controller::SimpleGoalChecker
      xy_goal_tolerance: 0.20
      yaw_goal_tolerance: 0.26
      stateful: true
    FollowPath:
      plugin: nav2_mppi_controller::MPPIController
      motion_model: Ackermann
      AckermannConstraints:
        min_turning_r: 0.62
      model_dt: 0.10
      time_steps: 20
      batch_size: 800
      iteration_count: 1
      vx_std: 0.30
      vy_std: 0.0
      wz_std: 0.70
      vx_max: 0.45
      vx_min: 0.0
      vy_max: 0.0
      wz_max: 0.72
      ax_max: 1.50
      ax_min: -1.50
      az_max: 2.50
      temperature: 0.30
      gamma: 0.015
      prune_distance: 1.5
      transform_tolerance: 0.20
      visualize: false
      critics: [ConstraintCritic, ObstaclesCritic, GoalCritic, GoalAngleCritic,
                PathAlignCritic, PathFollowCritic, PathAngleCritic, PreferForwardCritic]
      ConstraintCritic:
        cost_power: 1
        cost_weight: 4.0
      ObstaclesCritic:
        repulsion_weight: 2.0
        critical_weight: 20.0
        consider_footprint: true
        collision_cost: 10000.0
        collision_margin_distance: 0.08
        near_goal_distance: 0.5
      GoalCritic:
        cost_power: 1
        cost_weight: 5.0
        threshold_to_consider: 1.0
      GoalAngleCritic:
        cost_power: 1
        cost_weight: 2.0
        threshold_to_consider: 0.5
      PathAlignCritic:
        cost_power: 1
        cost_weight: 5.0
        max_heuristic_dist: 1.5
      PathFollowCritic:
        cost_power: 1
        cost_weight: 5.0
        offset_from_furthest: 6
      PathAngleCritic:
        cost_power: 1
        cost_weight: 1.0
        offset_from_furthest: 4
        threshold_to_consider: 1.0
        max_angle_to_furthest: 0.785
      PreferForwardCritic:
        cost_power: 1
        cost_weight: 5.0

smoother_server:
  ros__parameters:
    use_sim_time: false
    smoother_plugins: [simple_smoother]
    simple_smoother:
      plugin: nav2_smoother::SimpleSmoother
      tolerance: 1.0e-10
      max_its: 1000
      do_refinement: true

planner_server:
  ros__parameters:
    use_sim_time: false
    expected_planner_frequency: 5.0
    planner_plugins: [GridBased]
    GridBased:
      plugin: nav2_smac_planner/SmacPlannerHybrid
      tolerance: 0.30
      allow_unknown: false
      max_iterations: 100000
      max_planning_time: 1.0
      # MPPI is configured forward-only, so the global planner must not emit
      # reverse primitives that the local controller cannot execute.
      motion_model_for_search: DUBIN
      cost_travel_multiplier: 2.0
      downsample_costmap: true
      downsampling_factor: 2
      angle_quantization_bins: 48
      analytic_expansion_ratio: 3.5
      analytic_expansion_max_length: 3.0
      minimum_turning_radius: 0.62
      reverse_penalty: 10.0
      change_penalty: 20.0
      non_straight_penalty: 5.0
      cost_penalty: 2.0
      cache_obstacle_heuristic: true
      max_steer_angle: 0.5236
      wheelbase: 0.30
      is_collision_checking_cost: true

local_costmap:
  local_costmap:
    ros__parameters:
      use_sim_time: false
      update_frequency: 10.0
      publish_frequency: 10.0
      global_frame: odom_combined
      robot_base_frame: base_link
      rolling_window: true
      width: 8
      height: 8
      resolution: 0.05
      # base_link is the chassis center; base_footprint is the lidar origin
      # at (-0.41,-0.12) in this frame.  Keep the footprint centered on the
      # chassis so a wall behind the lidar does not make the start cell lethal.
      footprint: "[[-0.138, -0.125], [-0.138, 0.125], [0.138, 0.125], [0.138, -0.125]]"
      footprint_padding: 0.02
      plugins: [obstacle_layer, inflation_layer]
      obstacle_layer:
        plugin: nav2_costmap_2d::ObstacleLayer
        enabled: true
        observation_sources: scan
        scan:
          topic: /scan
          data_type: LaserScan
          clearing: true
          marking: true
          inf_is_valid: true
          obstacle_min_range: 0.10
          obstacle_max_range: 4.50
          raytrace_min_range: 0.10
          raytrace_max_range: 5.00
          max_obstacle_height: 2.0
      inflation_layer:
        plugin: nav2_costmap_2d::InflationLayer
        inflation_radius: 0.40
        cost_scaling_factor: 10.0
      always_send_full_costmap: false
  local_costmap_client:
    ros__parameters: {use_sim_time: false}
  local_costmap_rclcpp_node:
    ros__parameters: {use_sim_time: false}

global_costmap:
  global_costmap:
    ros__parameters:
      use_sim_time: false
      update_frequency: 3.0
      publish_frequency: 2.0
      global_frame: map
      robot_base_frame: base_link
      rolling_window: false
      resolution: 0.06
      footprint: "[[-0.138, -0.125], [-0.138, 0.125], [0.138, 0.125], [0.138, -0.125]]"
      footprint_padding: 0.02
      plugins: [static_layer, obstacle_layer, inflation_layer]
      static_layer:
        plugin: nav2_costmap_2d::StaticLayer
        map_subscribe_transient_local: true
      obstacle_layer:
        plugin: nav2_costmap_2d::ObstacleLayer
        enabled: true
        observation_sources: scan
        scan:
          topic: /scan
          data_type: LaserScan
          clearing: true
          marking: true
          inf_is_valid: true
          obstacle_min_range: 0.10
          obstacle_max_range: 3.00
          raytrace_min_range: 0.10
          raytrace_max_range: 5.00
          max_obstacle_height: 2.0
      inflation_layer:
        plugin: nav2_costmap_2d::InflationLayer
        inflation_radius: 0.40
        cost_scaling_factor: 10.0
      always_send_full_costmap: true
  global_costmap_client:
    ros__parameters: {use_sim_time: false}
  global_costmap_rclcpp_node:
    ros__parameters: {use_sim_time: false}

bt_navigator:
  ros__parameters:
    use_sim_time: false
    global_frame: map
    robot_base_frame: base_link
    odom_topic: /odom_combined
    transform_tolerance: 0.20
    bt_loop_duration: 50
    default_server_timeout: 20
    default_nav_to_pose_bt_xml: navigate_to_pose_s1.xml
    default_nav_through_poses_bt_xml: navigate_through_poses_s1.xml
    navigators: [navigate_to_pose]
    navigate_to_pose:
      plugin: nav2_bt_navigator::NavigateToPoseNavigator

behavior_server:
  ros__parameters:
    use_sim_time: false
    costmap_topic: local_costmap/costmap_raw
    footprint_topic: local_costmap/published_footprint
    cycle_frequency: 10.0
    # Only a forward Ackermann-compatible recovery is registered.  The S1 BT
    # deliberately has no in-place Spin or zero-speed Wait action.
    behavior_plugins: [drive_on_heading]
    drive_on_heading:
      plugin: nav2_behaviors/DriveOnHeading
    global_frame: odom_combined
    robot_base_frame: base_link
    transform_tolerance: 0.20
    simulate_ahead_time: 2.0
    max_rotational_vel: 0.72
    min_rotational_vel: 0.0
    rotational_acc_lim: 2.5

waypoint_follower:
  ros__parameters:
    use_sim_time: false
    loop_rate: 20
    stop_on_failure: true
    waypoint_task_executor_plugin: wait_at_waypoint
    wait_at_waypoint:
      plugin: nav2_waypoint_follower::WaitAtWaypoint
      enabled: false

velocity_smoother:
  ros__parameters:
    use_sim_time: false
    smoothing_frequency: 20.0
    scale_velocities: false
    feedback: OPEN_LOOP
    max_velocity: [0.45, 0.0, 0.72]
    min_velocity: [0.0, 0.0, -0.72]
    max_accel: [1.50, 0.0, 2.50]
    max_decel: [-1.50, 0.0, -2.50]
    odom_topic: /odom_combined
    odom_duration: 0.10
    deadband_velocity: [0.0, 0.0, 0.0]

controller_server_rclcpp_node:
  ros__parameters: {use_sim_time: false}
planner_server_rclcpp_node:
  ros__parameters: {use_sim_time: false}
