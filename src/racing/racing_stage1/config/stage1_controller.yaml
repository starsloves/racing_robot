    # 通道通用跟踪与规划参数。path_follow_mode 固定为 pure_pursuit；planner_* 仅在 use_corridor_planner=true 时参与。
    # What: lookahead/turn_kp/heading_stop 控制路径转弯；brake_*、capture_*、near_distance 控制接近路点时的降速；timeout 是异常退出上限。
    # Why: 当前 0.35m 前视适合狭通道和 0.58m/s 巡航，45s 仅防止状态机卡死。
