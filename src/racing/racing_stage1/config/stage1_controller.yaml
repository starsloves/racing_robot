# ================================================================================
# Stage1 竞赛控制器配置 (competition_controller)
# ================================================================================
# 功能模块：
#   1. 盲开前进（blind forward）
#   2. 激光聚类避障（4状态：forward → avoiding → countersteering → recovering）
#   3. 二维码识别触发后退
#   4. 路径记录与后退（backing along recorded path）
#   5. 实测中心线快速通道导航（激光避障后回归中心线）
# ================================================================================

competition_controller:
  ros__parameters:

    # ────────────────────────────────────────────────────────────────────────
    # 话题配置 (Topic Configuration)
    # ────────────────────────────────────────────────────────────────────────

    # 输出控制指令话题（发送到底盘）
    output_cmd_topic: /cmd_vel

    # Stage2 控制指令话题（Phase2 时订阅并转发）
    stage2_cmd_topic: /stage2_cmd_vel

    # Stage3 控制指令话题；总赛由本节点统一仲裁后输出 /cmd_vel。
    stage3_cmd_topic: /stage3_cmd_vel

    # 激光雷达扫描话题（用于避障）
    scan_topic: /scan

    # IMU 九轴数据话题（用于航向控制）
    imu_topic: /imu/data

    # 初始静止时的赛场 map 航向 (°)。首帧原始 IMU yaw 映射到该值，
    # 后续仅叠加 IMU 的相对转角，供 Stage1 全部状态使用。
    # Stage1 和总启动会由此派生 map_to_odom_yaw，二者必须一致。
    imu_initial_map_yaw_deg: 10.0
    # 发布给 Stage2 的 latched IMU->map 航向零点映射；Stage2 必须继承此值。
    imu_map_yaw_offset_topic: imu_map_yaw_offset

    # 里程计话题（EKF 融合后的位姿，用于路径记录和后退）
    odom_topic: /odom_combined

    # 地图话题（保留给可选 A* 降级规划）
    map_topic: /map

    # 二维码识别结果话题（触发后退与通道导航）
    qr_result_topic: qr_scan_result

    # 赛程阶段发布话题（Phase1/2/3 切换通知）
    phase_topic: competition_phase

    # 扫码任务发布话题（二维码内容）
    task_topic: competition_qr_task

    # Stage2 状态订阅话题（监听 Stage2 完成信号）
    stage2_state_topic: stage2_state

    # Stage3 状态订阅话题（监听 Stage3 完成信号）
    stage3_state_topic: stage3_state

    # ────────────────────────────────────────────────────────────────────────
    # 坐标系配置 (Frame IDs)
    # ────────────────────────────────────────────────────────────────────────

    # 全局地图坐标系（A* 规划与位姿查询）
    map_frame: map

    # 机器人底盘坐标系（TF 变换目标）
    base_frame: base_footprint

    # 里程计坐标系（odom_combined 对应的 TF 坐标系）
    odom_frame: odom_combined

    # map -> odom_combined 静态变换平移 (m)。由 Stage1/总启动读取后发布 TF。
    map_to_odom_x: 0.25
    map_to_odom_y: 0.15

    # ────────────────────────────────────────────────────────────────────────
    # 控制频率 (Control Rate)
    # ────────────────────────────────────────────────────────────────────────

    # 主控制循环频率 (Hz)
    control_rate_hz: 20.0

    # ────────────────────────────────────────────────────────────────────────
    # 盲开速度 (Blind Forward Speed)
    # ────────────────────────────────────────────────────────────────────────

    # 盲开线速度 (m/s) — Phase1 初始前进速度
    blind_linear_speed: 0.50

    # 二维码接近区减速起点（/odom_combined X，m）。超过该值时使用下方速度。
    blind_qr_slowdown_start_x_m: 1.5

    # 二维码接近区盲开线速度 (m/s)，降低运动模糊。
    blind_qr_slowdown_linear_speed: 0.4

    # 盲开角速度 (rad/s) — 通常为 0（直行）
    blind_angular_speed: 0.0

    # ────────────────────────────────────────────────────────────────────────
    # 二维码扫描中心线与受限避障 (QR Scan Centerline Avoidance)
    # ────────────────────────────────────────────────────────────────────────

    # 二维码观察区的 map 中心线。当前赛道是直线；代码按折线处理，实车改线时
    # 只需增加中继点。扫码解码和中心线导向使用不同门线，避免过早拐向横带。
    blind_scan_centerline_json: '[{"x":0.25,"y":1.80},{"x":4.50,"y":1.80}]'
    # 二维码解码从此处开始；该门线不产生转向命令。
    blind_scan_capture_start_odom_x_m: 1.0
    # 未识别二维码时，接近观察位才允许向中心线切入；切入角速度经 ramp 平滑增加。
    blind_scan_guidance_start_odom_x_m: 3.0
    blind_scan_guidance_ramp_m: 0.80

    # 识别带允许偏离中心线的最大横向距离。左/右避障完整预测任一时刻超出该值
    # 即淘汰；车辆已经在带外时，只允许令偏差不再增大的候选。
    blind_scan_corridor_half_width_m: 0.35

    # 进入 guidance 窗口后，才以中心线横向误差生成 IMU 目标航向。
    blind_scan_lateral_kp: 1.0
    blind_scan_max_heading_offset_deg: 20.0
    blind_scan_heading_kp: 1.4
    blind_scan_max_angular_speed: 0.35
    blind_scan_guidance_max_angular_speed: 0.18

    # 左/右候选按避障、反舵及回归中心线的完整动作积分预测；任一候选与障碍
    # 中心的最小距离小于该净距，或越出扫描带，均不可采用。两侧不可行时停车。
    blind_scan_avoid_prediction_sec: 1.80
    blind_scan_avoid_prediction_step_sec: 0.05
    blind_scan_avoid_min_clearance_m: 0.28
    # 扫码阶段提前发现前方聚类，给完整 S 形绕行保留制动/横移距离。
    blind_scan_avoid_detection_max_x_m: 1.00
    # 两个前向候选均不可行时，只尝试一次后退转向脱困。车后近区有聚类则立刻停车。
    blind_scan_escape_reverse_linear_speed_mps: -0.16
    blind_scan_escape_reverse_angular_speed: 0.55
    blind_scan_escape_reverse_duration_sec: 0.80
    # 后退已创造前向净距时，允许一次有限的扫描带外横移，随后恢复中心线。
    blind_scan_escape_corridor_extra_m: 0.12
    blind_scan_escape_rear_min_x_m: -0.45
    blind_scan_escape_rear_max_x_m: -0.08
    blind_scan_escape_rear_half_width_m: 0.22

    # ────────────────────────────────────────────────────────────────────────
    # 激光避障参数 (Lidar Obstacle Avoidance)
    # ────────────────────────────────────────────────────────────────────────

    # --- 前方检测窗口 (Forward Detection Window) ---
    # 前方窗口最小 X 距离 (m) — 距车体前端的近界
    phase1_window_min_x: 0.18

    # 前方窗口最大 X 距离 (m) — 距车体前端的远界
    phase1_window_max_x: 0.60

    # 前方窗口半宽 (m) — Y 方向±半宽，形成矩形检测区域
    phase1_window_half_width: 0.22

    # --- 聚类过滤参数 (Clustering Filter) ---
    # 聚类间隙容差 (m) — 点云间距小于此值视为同一障碍物
    phase1_cluster_gap_tolerance: 0.12

    # 最小聚类点数 — 点数少于此值的聚类被过滤
    phase1_min_cluster_points: 3

    # 最小聚类宽度 (m) — 宽度小于此值的聚类被过滤（噪声）
    phase1_min_cluster_width: 0.06

    # 最大聚类宽度 (m) — 宽度大于此值的聚类被过滤（墙体）
    phase1_max_cluster_width: 0.55

    # --- 紧急停障窗口 (Emergency Stop Window) ---
    # 紧急窗口最小 X 距离 (m) — 更近的检测窗口
    phase1_emergency_min_x: 0.08

    # 紧急窗口最大 X 距离 (m)
    phase1_emergency_max_x: 0.45

    # 紧急窗口半宽 (m) — 更窄的检测区域
    phase1_emergency_half_width: 0.12

    # 紧急窗口最小点数
    phase1_emergency_min_points: 2

    # --- 避障动作参数 (Avoidance Action) ---
    # 避障线速度 (m/s) — 避障期间前进速度
    avoid_linear_speed: 0.3

    # 避障角速度 (rad/s)
    avoid_angular_speed: 0.8

    # 有效障碍物中心位于车体左前方且角度不小于此值时，首次避障改为右转；
    # 通道导航的局部安全回退也使用此阈值。ROS base 坐标中，正角为左侧。
    avoid_right_turn_left_obstacle_angle_deg: 15.0

    # 通道导航避障时，结合当前 map 路点选择左右绕行；true 时生效。
    corridor_avoid_goal_bias_enabled: true

    # 障碍物明确位于候选绕行侧时附加的安全代价（rad），必须大于 π，
    # 使路点方向不能驱动车辆朝该侧近障切入。
    corridor_avoid_obstacle_side_penalty: 3.5

    # 通道内小于该宽度的短点簇不触发倒车，避免 7~8cm 边缘/噪声误判障碍。
    corridor_obstacle_min_width_m: 0.12

    # 通道已由雷达墙簇接管时，不做正向绕障：持续倒车并让车头摆离障碍，
    # 直到前方障碍连续清除，再直接恢复墙簇跟随回到通道入口。
    corridor_reverse_avoid_enabled: true
    corridor_reverse_avoid_linear_speed_mps: -0.14
    corridor_reverse_avoid_angular_speed: 0.14
    corridor_reverse_avoid_min_duration_sec: 0.65
    corridor_reverse_avoid_clear_hold_sec: 0.25
    # 用本次倒退结束后的通道起点作为回退目标；不是倒车时长上限。
    corridor_reverse_avoid_entry_tolerance_m: 0.25

    # 避障最小持续时间 (s) — 避障至少持续时长
    avoid_min_duration_sec: 0.5

    # 障碍清除保持时间 (s) — 障碍清除后需保持此时长才切换状态
    avoid_clear_hold_sec: 0.25

    # 避障最小转向角度 (°) — 相对初始航向至少转过此角度
    avoid_min_turn_angle_deg: 30.0

    # 启动宽限期 (s) — 节点启动后此时间内不触发避障（避免噪声误触发）
    phase1_avoid_startup_grace_sec: 0.5

    # --- 激光扫描配置 (Lidar Scan Config) ---
    # 扫描角度范围 (°) — ±此角度内的激光点参与检测
    scan_angle_deg: 45.0

    # 安全距离 (m) — 障碍物距离小于此值触发避障
    safe_distance: 0.6

    # 清除距离 (m) — 障碍物距离大于此值视为清除
    clear_distance: 0.65

    # 最小有效量程 (m) — 激光点距离小于此值视为无效
    min_valid_range: 0.10

    # ────────────────────────────────────────────────────────────────────────
    # 避障恢复 (Avoidance Recovery)
    # ────────────────────────────────────────────────────────────────────────

    # --- 反舵阶段 (Counter Steering) ---
    # 反舵线速度 (m/s)
    counter_steer_linear_speed: 0.30

    # 反舵角速度 (rad/s) — 反向转向速度（第二个转角，减小避免过冲）
    counter_steer_angular_speed: 1.0

    # 反舵持续时间缩放系数 — 反舵时长 = 避障时长 × 此系数
    counter_steer_duration_scale: 0.6

    # 反舵最小持续时间 (s)
    counter_steer_min_duration_sec: 0.30

    # 反舵最大持续时间 (s)
    counter_steer_max_duration_sec: 1.00

    # --- 恢复阶段 (Recovery) ---
    # 恢复线速度 (m/s) — 直行恢复速度
    recovery_linear_speed: 0.35

    # 恢复转弯线速度 (m/s) — 转弯修正时的前进速度
    recovery_turn_linear_speed: 0.20

    # 恢复角速度 (rad/s) — 基于时间的恢复转向速度（减小避免回正过冲）
    recovery_angular_speed: 0.40

    # 恢复航向比例增益 — 航向误差 → 角速度修正增益（减小避免回正过冲）
    recovery_heading_kp: 1.5

    # 恢复最大角速度 (rad/s)
    recovery_max_angular_speed: 0.6

    # 恢复最小角速度 (rad/s) — 防止微小误差时转速过低
    recovery_min_angular_speed: 0.3

    # 原地转向角度阈值 (°) — 航向误差小于此值时边走边转，否则原地转
    recovery_in_place_angle_deg: 8.0

    # 航向容差 (°) — 航向误差小于此值视为到位
    heading_tolerance_deg: 6.0

    # 恢复超时 (s) — 恢复阶段最长时间
    recovery_timeout: 2.5

    # 恢复持续时间缩放 — 基于避障时长估算恢复时长
    recovery_duration_scale: 0.9

    # ────────────────────────────────────────────────────────────────────────
    # 后退功能 (Backing Along Recorded Path)
    # ────────────────────────────────────────────────────────────────────────

    # 启用后退功能 — true: 扫码后沿轨迹后退, false: 直接通道导航
    enable_backing: true

    # 后退目标 X (m, map 坐标系) — 后退到 map_x ≤ 此值时停止
    back_target_x: 2.0

    # 后退线速度 (m/s) — 负值表示倒车；速度须低于 0.05m 轨迹采样的可跟踪范围
    back_linear_speed: -0.40

    # 后退航向修正增益 — 航向误差 → 角速度增益
    back_angular_kp: 0.9

    # 后退角速度绝对上限与每秒变化率，抑制高速倒退时的反复反打
    back_max_angular_speed: 0.50
    back_angular_slew_rate: 0.50

    # 路点到达容差 (m) — 小于采样间隔的两倍，避免一次跳过多个路点
    back_position_tolerance: 0.04

    # 路径采样间隔 (m) — 前进时每隔此距离记录一个路点
    back_path_sample_distance: 0.02

    # 倒序路径前瞻距离 (m) — 高速倒退需跨多个采样点以平滑目标航向
    back_lookahead_m: 0.18

    # 后退超时 (s) — 后退超过此时长则跳过后退，直接通道导航
    back_timeout_sec: 20.0

    # 对齐目标航向 (°) — 后退完成后对齐到此航向（通常 90°）
    back_align_yaw_deg: 90.0

    # 对齐航向容差 (°)
    back_align_tolerance_deg: 5.0

    # 对齐超时 (s) — 航向对齐超过此时长则跳过，进入通道导航
    back_align_timeout_sec: 10.0

    # ────────────────────────────────────────────────────────────────────────
    # 通道导航 (Corridor Navigation - Region Entry)
    # ────────────────────────────────────────────────────────────────────────

    # 启用通道导航 — false: 后退完成直接切 Stage2
    enable_corridor_navigation: true

    # 通道路径发布话题（用于 RViz2 可视化）
    corridor_path_topic: /stage1_corridor_path

    # --- 通道路点 (Waypoints in map frame) ---
    # 途经点 + 终点，JSON 格式：[{"x": ..., "y": ..., "speed": ..., "description": ...}, ...]
    # 按数组顺序逐点跟踪；用于中继点推进与最终交接判据。
    corridor_waypoints_json: '[{"x":2.55,"y":1.20,"speed":0.20,"description":"corridor_mid_1"},{"x":2.55,"y":2.55,"speed":0.18,"yaw_deg":90.0,"description":"corridor_goal"}]'

    # 使用实车测得的快速中心线。正常行驶及激光避障恢复均沿该线跟踪，
    # 不因局部偏差反复运行全局 A*；障碍避让仍由既有激光状态机接管。
    corridor_reference_path_enabled: true
    corridor_reference_path_json: '[{"x":2.18,"y":0.72},{"x":2.38,"y":0.96},{"x":2.45,"y":1.20},{"x":2.55,"y":1.75},{"x":2.55,"y":2.20},{"x":2.55,"y":2.55}]'

    # 途经点容差 (m) — 距离途经点小于此值时推进到下一路点
    corridor_waypoint_tolerance: 0.25

    # 终点容差 (m) — 距离终点小于此值时判定到达
    # X方向±10cm，Y方向±5cm，欧氏距离约12cm
    corridor_goal_tolerance: 0.12

    # 终点目标航向 (°, map 坐标系) — 通道出口期望航向
    corridor_goal_yaw_deg: 90.0

    # 终点航向容差 (°) — 航向误差小于此值判定航向到位
    # Stage2 入口会再对齐，此处控制在 15° 保证精度
    corridor_goal_yaw_tolerance_deg: 15.0

    # --- 区域进入判据 (Region Entry Criteria) ---
    # 旧版圆形进入判定半径 (m) — 仅 terminal_enabled=false 时使用
    corridor_entry_region_radius_m: 0.10

    # Stage1 -> Stage2 交权的最小 map Y (m) — 即使已进入圆形区域，也必须到达该 Y 门线后才放行
    # 终端逼近持续到该门线，防止目标前提前交权
    corridor_release_min_y_m: 2.50

    # 交权只允许在门线后的有限窗口内发生；超过该 Y 说明避障或回正已越点，
    # 必须倒回 staging 区重新捕获，禁止高位直接进入 Stage2。
    corridor_release_max_y_m: 2.62
    # 终端重捕获的默认最高 staging Y。实际 staging 会根据当前横向偏差
    # 回退到更早的参考中心线点，保证在门线前可按受限角度重新并线。
    corridor_reacquire_y_m: 2.05
    corridor_reacquire_reverse_speed: -0.12
    # 重入参考中心线时允许的最大几何航向偏差；控制器据此选择最晚 staging 点。
    corridor_reacquire_max_reentry_heading_deg: 45.0
    # 重入点必须位于交权最小 Y 门线之前保留的距离，供末端捕获和围墙锁定使用。
    corridor_reacquire_terminal_margin_m: 0.20

    # 旧版进入区域航向容差 (°) — 仅 terminal_enabled=false 时使用
    corridor_entry_yaw_tolerance_deg: 15.0

    # 旧版是否要求航向满足才放行 — 仅 terminal_enabled=false 时使用
    corridor_require_yaw_for_release: false

    # --- 终端逼近 (Terminal Approach) ---
    # 近 Y 门线且 X 已进入捕获带时锁存；锁存后先回正航向再微调至最终 X 窗口
    corridor_terminal_enabled: true

    # Stage2 交权所需的最终横向 X 误差容差 (m)
    corridor_terminal_x_tolerance_m: 0.06

    # 只有横向误差已收敛到该捕获带才进入终端微调。更大的误差必须在
    # staging 到门线之间沿参考中心线修正，避免终端正向微调越过 Y 窗口。
    corridor_terminal_entry_x_tolerance_m: 0.10

    # 终端锁存后若 X 再偏离该值，才退出回 Pure Pursuit；必须大于最终 X 容差以避免抖动
    corridor_terminal_x_exit_tolerance_m: 0.28

    # 切入终端逼近所需的 IMU 航向误差容差 (°)
    corridor_terminal_yaw_tolerance_deg: 8.0

    # Stage1 放权 Stage2 所需的 IMU 航向误差容差 (°)
    corridor_terminal_release_yaw_tolerance_deg: 10.0

    # 终端逼近固定正线速度 (m/s)，正常导航中绝不为 0
    corridor_terminal_linear_speed: 0.16

    # 距离 Y 门线该距离以内，若仍未进入最终 X 容差才开启微小横向修正 (m)
    corridor_terminal_micro_start_y_margin_m: 0.18

    # 无双墙时，最后一小段 map X 兜底误差映射到期望航向的增益 (1/m)。
    # 双墙有效时终端目标航向固定为 corridor_goal_yaw，不使用该项拉偏 IMU yaw。
    corridor_terminal_lateral_gain: 0.8

    # 期望航向误差到角速度的比例增益
    corridor_terminal_heading_kp: 1.0

    # 航向死区 (°) — 死区内 w=0，防止持续反复打舵
    corridor_terminal_yaw_deadband_deg: 1.0

    # 终端逼近角速度绝对上限 (rad/s)
    corridor_terminal_max_angular_speed: 0.30

    # 最后一小段 X 微调的角速度绝对上限 (rad/s)
    corridor_terminal_micro_max_angular_speed: 0.12

    # 终端逼近角速度每秒最大变化量 (rad/s²)，限制左右反打
    corridor_terminal_angular_slew_rate_rad_s2: 0.25

    # 仅用于终端横向闭环的 X 误差低通时间常数 (s)；交权判据仍使用原始 map X
    corridor_terminal_x_filter_tau_sec: 0.20

    # 终端横向修正反向前的 X 误差滞回带 (m)，抑制目标线附近的来回换向
    corridor_terminal_x_reverse_hysteresis_m: 0.015

    # 最后路点进入 Y 门线前的预对正距离 (m)。在仍正向行驶时同时收敛 IMU 航向。
    corridor_terminal_prealign_y_margin_m: 0.50

    # 预对正航向闭环增益与角速度上限 (rad/s)
    corridor_terminal_prealign_heading_kp: 1.2
    corridor_terminal_prealign_max_angular_speed: 0.25

    # 仅在已到 Y 门线和最终 X 窗口、但航向未对齐时，低速后退回正
    terminal_reverse_align_linear_speed: -0.12
    terminal_reverse_align_heading_kp: 1.0
    terminal_reverse_align_max_angular_speed: 0.35

    # --- 两侧围墙终端锁定 (Side-Wall Terminal Lock) ---
    # 通道没有额外标记；使用车前左右两侧围墙分别拟合直线，中线即物理通道中心。
    # 激光仅提供物理中心及墙轴质量；终端绝对 yaw 固定唯一来自 IMU。
    corridor_terminal_wall_lock_enabled: true
    corridor_terminal_wall_min_forward_m: 0.10
    # 5m 场地中央行驶时，外侧围墙距车可接近 2.5m；不能只取近墙。
    corridor_terminal_wall_max_forward_m: 2.00
    corridor_terminal_wall_min_lateral_m: 0.10
    corridor_terminal_wall_max_lateral_m: 4.00
    corridor_terminal_wall_min_points: 8
    corridor_terminal_wall_min_span_m: 0.45
    corridor_terminal_wall_fit_residual_m: 0.035
    # 只有墙线轴向与出口 IMU 航向（90°，线可正反同向）一致才是通道侧墙。
    corridor_terminal_wall_axis_tolerance_deg: 25.0
    # 仅相邻激光点间距不超过 0.30m 的连续整段才可构成边墙；障碍物离散点不会并入。
    corridor_terminal_wall_cluster_gap_m: 0.30
    # 完整赛道边界在当前前视窗口内至少应有该前向跨度。
    corridor_terminal_wall_cluster_min_span_m: 0.75
    # 同侧已锁墙簇短暂消失时，不切换到另一段不相干结构。
    corridor_terminal_wall_source_hold_sec: 0.60
    corridor_terminal_wall_source_heading_jump_deg: 12.0
    corridor_terminal_wall_source_distance_jump_m: 0.35
    corridor_terminal_wall_parallel_tolerance_deg: 5.0
    corridor_terminal_wall_width_min_m: 0.35
    corridor_terminal_wall_width_max_m: 5.60
    corridor_terminal_wall_filter_tau_sec: 0.18
    corridor_terminal_wall_max_age_sec: 0.25
    # 双墙短暂被入口边缘遮挡时，终端可复用最近一次合格物理中心；只用于交权段。
    corridor_terminal_wall_latch_max_age_sec: 4.0
    # 车体参考点不在物理通道中心时，在此填入中心线在车体系的 Y 偏置；默认 0。
    corridor_terminal_wall_center_offset_m: 0.0

    # 交权前必须同时满足 map X、IMU yaw、Y 门线与两侧围墙局部几何，并持续 hold 时间。
    corridor_terminal_wall_release_center_tolerance_m: 0.060
    corridor_terminal_wall_release_heading_deg: 2.5
    corridor_terminal_release_hold_sec: 0.20

    # 到 Y 门线前 0.35m 已居中平行则提交为直线段；提交后禁止再用横向误差反打。
    # 若中心或平行误差超过 abort 门限，立即倒回 staging 重捕获。
    corridor_terminal_commit_y_margin_m: 0.35
    corridor_terminal_commit_speed_mps: 0.28
    corridor_terminal_commit_center_tolerance_m: 0.060
    corridor_terminal_commit_heading_deg: 2.0
    corridor_terminal_commit_abort_center_m: 0.100
    corridor_terminal_commit_abort_heading_deg: 4.0

    # 二维码倒退结束即进入围墙直跟：只有成对且轴向正确的围墙可接管方向。
    # 未形成双墙时低速 IMU 对正通道轴，禁止单墙横向结构把车带偏。
    corridor_wall_follow_enabled: true
    corridor_wall_follow_require_lock: true
    corridor_wall_follow_linear_speed_mps: 0.32
    corridor_wall_follow_lateral_gain: 0.80
    corridor_wall_follow_heading_kp: 1.0
    corridor_wall_follow_max_angular_speed: 0.24
    corridor_wall_follow_no_lock_log_sec: 1.0
    corridor_wall_acquire_speed_mps: 0.10
    corridor_wall_acquire_heading_kp: 0.80
    corridor_wall_acquire_max_angular_speed: 0.18
    # 单墙不能区分底边/侧边，只保留诊断，不允许决定通道行进方向。
    corridor_wall_follow_single_wall_enabled: false
    corridor_wall_follow_single_wall_speed_mps: 0.20
    # 围墙中心已是物理横向依据；map X 仅作诊断，交权不再以其阻塞。
    corridor_wall_follow_require_map_x_handoff: false

    # 通道导航超时 (s) — 超时后强制切 Stage2
    corridor_timeout_sec: 45.0

    # 日志输出周期 (s) — 每隔此时间打印一次导航状态
    corridor_log_period_sec: 0.5

    # ────────────────────────────────────────────────────────────────────────
    # 通道导航控制参数 (Corridor Control)
    # ────────────────────────────────────────────────────────────────────────

    # --- 路径跟踪模式 (Path Following Mode) ---
    # pure_pursuit: 纯追踪, stanley: Stanley 控制器
    corridor_path_follow_mode: pure_pursuit

    # --- 速度参数 (Speed Control) ---
    # 通道巡航速度 (m/s)：中心线模式无障碍时的高速上限
    corridor_linear_speed: 0.48

    # 转弯线速度 (m/s) — 大角度转向时的前进速度
    turn_linear_speed: 0.12

    # 转弯最小角速度 (rad/s) — 防止转速过低
    turn_min_angular_speed: 0.15

    # 转弯角速度上限 (rad/s)
    turn_angular_speed: 0.55

    # 全局最大角速度 (rad/s)
    max_angular_speed: 0.60

    # 蠕行速度 (m/s) — 近场收敛时的最低速度
    corridor_creep_speed: 0.08

    # 最低巡航速度 (m/s) — 通道中的最低前进速度
    corridor_min_cruise_speed: 0.15

    # 转弯时最大线速度 (m/s) — 大角速度时限制线速度
    corridor_max_turn_linear_speed: 0.22

    # --- Pure Pursuit 参数 ---
    # 前视距离 (m) — 追踪路径上前方此距离的点
    pure_pursuit_lookahead_m: 0.35

    # 转向增益 — 曲率 → 角速度增益
    pure_pursuit_turn_kp: 1.5

    # 航向差停止阈值 (°) — 航向误差大于此值时停止纯追踪
    pure_pursuit_heading_stop_deg: 70.0

    # 最小前视距离 (m) — 防止前视距离过小
    corridor_pp_min_lookahead_m: 0.25

    # 速度缩放系数 — 线速度 = 巡航速度 × 此系数
    corridor_pp_speed_scale: 1.0

    # --- 控制增益 (Control Gains) ---
    # 距离误差 → 线速度增益
    corridor_rho_kp: 0.85

    # 航向误差 → 角速度增益（LOS 方向）
    corridor_alpha_kp: 2.0

    # 目标航向 → 角速度增益（融合终点航向）
    corridor_beta_kp: 0.80

    # 航向修正增益 — IMU 航向误差 → 角速度
    corridor_heading_kp: 1.0

    # Stanley 横向误差增益
    corridor_stanley_k: 1.2

    # 横向偏差修正增益
    corridor_lateral_kp: 1.8

    # X 坐标到位容差 (m) — map_x 误差小于此值视为 X 到位
    corridor_x_tolerance: 0.25

    # --- 近场收敛 (Near-Field Convergence) ---
    # 制动距离 (m) — 距离终点小于此值时开始减速
    corridor_brake_distance: 0.50

    # 制动增益 — 距离 → 线速度衰减系数
    corridor_brake_kp: 0.35

    # 捕获距离 (m) — 进入近场控制的距离
    corridor_capture_distance: 0.28

    # 捕获退出距离 (m) — 退出近场控制的距离
    corridor_capture_exit_distance: 0.45

    # 捕获速度 (m/s) — 近场控制时的线速度
    corridor_capture_speed: 0.20

    # 对齐线速度 (m/s) — 航向对齐时的线速度（0 = 原地转）
    corridor_align_linear_speed: 0.15

    # Beta 混合距离 (m) — 距离终点小于此值时融合目标航向
    corridor_beta_blend_distance: 0.70

    # 近场距离阈值 (m)
    corridor_near_distance: 0.45

    # ────────────────────────────────────────────────────────────────────────
    # 通道地图规划 (Corridor A* Path Planning)
    # ────────────────────────────────────────────────────────────────────────

    # 启用栅格规划器 — true: A* 避开障碍物, false: 直线连接路点
    use_corridor_planner: true

    # --- 栅格参数 (Grid Parameters) ---
    # 地图降采样倍率 — 每 N×N 个栅格合并为 1 个（降低计算量）
    planner_downsample: 4

    # 占据阈值 (0-100) — 栅格值 ≥ 此阈值视为障碍物
    planner_occupied_threshold: 50

    # 未知区域视为占据 — true: 未知区域不可通行
    planner_unknown_is_occupied: true

    # 障碍物膨胀半径 (m) — 障碍物向外膨胀此距离（安全余量）
    planner_obstacle_inflation_m: 0.14

    # --- 重规划触发条件 (Replanning Triggers) ---
    # 重规划周期 (s) — 最长间隔此时间重规划一次
    planner_replan_period_sec: 2.0

    # 重规划最小进度 (m) — 移动距离 ≥ 此值 + 超过周期时才重规划
    corridor_replan_min_progress_m: 0.30

    # 偏航重规划阈值 (m) — 偏离路径距离 ≥ 此值时立即重规划
    corridor_replan_offpath_m: 0.20

    # ────────────────────────────────────────────────────────────────────────
    # 倒车后重定向 (Post-Backing Reorientation, 可选)
    # ────────────────────────────────────────────────────────────────────────

    # 启用入口重定向 — true: 倒车后航向误差大时原地拧正
    corridor_entry_reorient_enabled: false

    # 触发重定向角度阈值 (°) — 航向误差 ≥ 此值时触发重定向
    corridor_entry_reorient_angle_deg: 50.0

    # 重定向完成角度 (°) — 航向误差 ≤ 此值时重定向完成
    corridor_entry_reorient_done_deg: 25.0

    # 重定向超时 (s)
    corridor_entry_reorient_timeout_sec: 4.0

    # 中线重定向角度阈值 (°) — 偏离中线航向 ≥ 此值时触发重定向
    corridor_centerline_reorient_deg: 55.0

    # 重定向时允许避障 — false: 重定向期间禁用避障（防止侧墙干扰）
    corridor_avoid_while_reorient: false

    # 强制重定向 — true: 每次进入通道都重定向
    corridor_force_reorient_enabled: false

    # ────────────────────────────────────────────────────────────────────────
    # 左侧恢复 (Left Recovery - Anti Right-Wall Drift)
    # ────────────────────────────────────────────────────────────────────────

    # 触发 X 阈值 (m, map 坐标系) — map_x > 此值时降速运行（防止贴右墙）
    corridor_left_recover_x: 3.0

    # 左旋角速度 (rad/s) — 向左旋回的角速度
    corridor_left_recover_angular: 0.70

    # 左旋线速度 (m/s) — 向左旋回时的前进速度（x>3.5m 时小速度运行）
    corridor_left_recover_linear: 0.08

    # Stage1 盲开右转区域（map 坐标系）
    blind_right_turn_x: 3.5
    blind_right_turn_y: 1.2
    blind_right_turn_angular: 0.70
    blind_right_turn_linear: 0.08

    # ────────────────────────────────────────────────────────────────────────
    # Phase 切换参数 (Phase Transition)
    # ────────────────────────────────────────────────────────────────────────

    # 切换停车时长 (s) — Phase 切换后停车等待此时长
    transition_stop_duration: 0.05

    # Stage2 指令超时 (s) — Phase2 时，超过此时长未收到 Stage2 指令则停车
    stage2_cmd_timeout: 0.5

    # Phase2 障碍覆盖 — true: Phase2 时仍响应 Phase1 避障
    phase2_obstacle_override: false

    # Phase2 紧急停车距离 (m) — Phase2 时障碍物距离 ≤ 此值立即停车
    phase2_emergency_stop_distance: 0.22

    # Phase3 外部控制 — true: Phase3 由 Stage3 节点控制，Stage1 不发指令
    phase3_external_control: true

    # 已废弃：Phase3 近障倒车和重新避障由 Stage3 完整控制，Stage1 只仲裁其速度指令。
    phase3_emergency_stop_distance: 0.22

    # ────────────────────────────────────────────────────────────────────────
    # 视觉通道导航 (Vision-based Corridor Navigation)
    # ────────────────────────────────────────────────────────────────────────

    # 启用视觉通道导航 — 当前禁用：Stage1 到通道口后直接切 Stage2，由 Stage2 惯导+视觉修正接管
    vision_corridor_enabled: false

    # YOLOv8-Seg 模型路径
    vision_corridor_model_path: /home/sunrise/dev_ws/src/racing/racing_stage2/models/bset.bin

    # 推理参数
    vision_corridor_conf_thres: 0.25        # 置信度阈值
    vision_corridor_iou_thres: 0.45         # NMS IOU 阈值
    vision_corridor_crop_ratio: 0.4         # 裁剪上方 40%（保留下方 60%）
    vision_corridor_crop_side_ratio: 0.20   # 左右各裁 20%（保留中间 60%）
    vision_corridor_http_port: 8081         # HTTP 可视化服务端口

    # 控制增益 (Control Gains)
    vision_corridor_lateral_kp: 1.2         # 横向误差增益
    vision_corridor_heading_kp: 1.5         # 航向误差增益
    vision_corridor_curvature_kp: 0.8       # 曲率补偿增益
    vision_corridor_max_angular: 0.55       # 最大角速度 (rad/s)

    # 速度参数 (Speed Control)
    vision_corridor_cruise_speed: 0.20      # 巡航速度 (m/s)
    vision_corridor_approach_speed: 0.12    # 接近入口速度 (m/s)
    vision_corridor_entry_threshold_m: 0.25 # 入口检测阈值（剩余距离 < 此值判定到达）

    # 融合策略 (Fusion Strategy)
    vision_corridor_timeout_sec: 0.5        # 视觉数据超时（超时降级到IMU直行）
    vision_corridor_min_confidence: 0.30    # 最小置信度阈值
    vision_corridor_imu_fallback_enabled: true  # 启用IMU直行兜底

    # 中线提取参数 (Centerline Extraction)
    vision_corridor_sample_rows: 9          # 采样行数
    vision_corridor_lookahead_ratio: 0.62   # 前瞻比例
    vision_corridor_min_valid_rows: 5       # 最少有效行数
