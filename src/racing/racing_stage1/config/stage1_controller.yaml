# S1 生产导航配置
# 静态禁行地图由 map_overlay.launch.py 发布 map_restricted.yaml；扫描障碍只进入
# 控制器的临时局部层，不回写 /map。位置来自 /odom_combined/TF，航向只来自 /imu/data。
competition_controller:
  ros__parameters:
    output_cmd_topic: /cmd_vel
    scan_topic: /scan
    imu_topic: /imu/data
    odom_topic: /odom_combined
    map_topic: /map
    map_frame: map
    base_frame: base_footprint
    odom_frame: odom_combined
    stage1_state_topic: stage1_state
    qr_result_topic: qr_scan_result
    task_topic: competition_qr_task
    stage2_entry_pose_topic: stage2_entry_pose
    imu_map_yaw_offset_topic: imu_map_yaw_offset
    start_corner_diagnostic_topic: start_corner_pose_diagnostic
    lifecycle_service_prefix: /competition/stage1
    control_rate_hz: 20.0

    # 仅用于静态 map->odom_combined TF 的 launch 默认值；控制器不会自动修改。
    map_to_odom_x: 0.50
    map_to_odom_y: 0.15
    map_to_odom_yaw_deg: 10.0
    initial_map_heading_deg: 10.0
    start_delay_sec: 0.0
    start_corner_diagnostic_wait_sec: 3.0
    localization_max_age_sec: 0.40
    map_max_age_sec: 5.0

    # 生产目标：扫码后先到二维码实际位置，再从实时位置规划到通道口。
    qr_goal_x_m: 4.50
    qr_goal_y_m: 1.60
    qr_goal_tolerance_m: 0.35
    channel_entry_x_m: 2.50
    channel_entry_y_m: 2.50
    channel_entry_yaw_deg: 90.0
    channel_entry_tolerance_m: 0.16
    channel_entry_yaw_tolerance_deg: 12.0

    # Hybrid-A* 风格全局搜索：航向离散、前进/倒车运动原语、最小转弯半径、
    # 换挡/倒车惩罚；地图外、未知格和黑色区域均为硬障碍。
    # Static-map route is held long enough for the local tracker to execute
    # its tangent; scan obstacles remain handled by the local layer.
    global_replan_period_sec: 1.50
    global_replan_position_delta_m: 0.65
    planner_grid_step_m: 0.08
    planner_heading_bins: 24
    planner_motion_step_m: 0.12
    planner_max_expansions: 50000
    planner_occupied_threshold: 50
    planner_unknown_is_occupied: true
    planner_robot_radius_m: 0.26
    planner_robot_front_m: 0.32
    planner_robot_rear_m: 0.23
    planner_min_turn_radius_m: 0.62
    planner_reverse_penalty: 2.8
    planner_change_gear_penalty: 4.0
    planner_turn_penalty: 0.35
    planner_steer_change_penalty: 0.40
    planner_goal_yaw_tolerance_deg: 18.0

    # 车体几何：雷达在 base_footprint，车体中心由实时 TF
    # base_footprint->base_link 给出；禁止再用以雷达为圆心的碰撞圆。
    robot_body_length_m: 0.276
    robot_body_width_m: 0.164
    robot_footprint_margin_m: 0.02
    scan_self_filter_margin_m: 0.04

    # MPPI 风格短时域采样：每条候选同时检查静态地图和实时 /scan 足迹碰撞。
    local_horizon_sec: 1.60
    local_dt_sec: 0.10
    local_samples_speed: 5
    local_samples_steer: 9
    local_nominal_speed_mps: 0.42
    local_min_speed_mps: 0.12
    local_max_speed_mps: 0.55
    local_min_turn_radius_m: 0.62
    local_max_angular_speed_rad_s: 0.75
    local_path_lookahead_m: 0.42
    local_footprint_radius_m: 0.28
    local_obstacle_clearance_m: 0.10
    local_dynamic_obstacle_max_range_m: 2.20
    # 倒车保留为受控恢复档：只有前进候选全部不安全，或当前车头明显
    # 背离路径切线时才会参与选择；不能单凭目标距离更近而倒车。
    local_allow_reverse: true
    local_reverse_only_when_forward_unsafe: true
    local_reverse_heading_threshold_deg: 105.0
    local_reverse_speed_mps: -0.22
    local_scan_max_points: 64
    local_reverse_penalty: 3.0
    local_steer_change_penalty: 0.25
    local_heading_control_weight: 60.0
    local_angular_effort_weight: 5.0
    local_path_distance_weight: 12.0
    local_heading_weight: 2.5
    local_goal_weight: 4.0
    local_clearance_weight: 3.0
    local_obstacle_cost_weight: 1000.0
    local_replan_period_sec: 0.10
    local_command_hold_sec: 0.55
    # 独立规划线程期间保持上一条安全命令；速度和角速度均限制变化率。
    local_max_linear_accel_mps2: 0.80
    local_max_angular_accel_rad_s2: 2.50

    # 独立硬安全层（Collision Monitor 等价约束），优先于任何局部轨迹。
    collision_stop_distance_m: 0.24
    collision_slow_distance_m: 0.62
    collision_stop_ttc_sec: 0.55
    collision_slow_ttc_sec: 1.40
    collision_slow_scale: 0.35
    collision_forward_half_angle_deg: 38.0
    collision_static_lateral_margin_m: 0.04
