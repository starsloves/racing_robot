competition_controller:
  ros__parameters:
    output_cmd_topic: /cmd_vel
    stage2_cmd_topic: /stage2_cmd_vel
    scan_topic: /scan
    imu_topic: /imu/data
    odom_topic: /odom_combined  # 统一使用 map 坐标系
    qr_result_topic: qr_scan_result
    phase_topic: competition_phase
    task_topic: competition_qr_task
    stage2_state_topic: stage2_state
    stage3_state_topic: stage3_state
    control_rate_hz: 20.0
    blind_linear_speed: 0.2
    blind_angular_speed: 0.0
    avoid_linear_speed: 0.1
    avoid_angular_speed: 0.8
    avoid_min_duration_sec: 0.7
    avoid_clear_hold_sec: 0.25
    avoid_min_turn_angle_deg: 18.0
    safe_distance: 0.5
    clear_distance: 0.65
    scan_angle_deg: 45.0
    phase1_window_min_x: 0.18
    phase1_window_max_x: 0.85
    phase1_window_half_width: 0.22
    phase1_cluster_gap_tolerance: 0.12
    phase1_min_cluster_points: 3
    phase1_min_cluster_width: 0.06
    phase1_max_cluster_width: 0.40
    phase1_emergency_min_x: 0.08
    phase1_emergency_max_x: 0.45
    phase1_emergency_half_width: 0.12
    phase1_emergency_min_points: 2
    min_valid_range: 0.15
    recovery_linear_speed: 0.12
    recovery_turn_linear_speed: 0.08
    recovery_angular_speed: 0.75
    counter_steer_linear_speed: 0.10
    counter_steer_angular_speed: 0.95
    counter_steer_duration_scale: 1.35
    counter_steer_min_duration_sec: 0.45
    counter_steer_max_duration_sec: 1.20
    recovery_heading_kp: 2.4
    recovery_max_angular_speed: 1.1
    recovery_min_angular_speed: 0.5
    recovery_in_place_angle_deg: 8.0
    heading_tolerance_deg: 6.0
    recovery_timeout: 2.5
    recovery_duration_scale: 0.9
    stage2_cmd_timeout: 0.5
    transition_stop_duration: 0.0
    phase2_obstacle_override: false
    phase2_emergency_stop_distance: 0.22
    phase3_external_control: true
    phase3_emergency_stop_distance: 0.22
    # 后退功能配置
    enable_backing: true
    back_target_x: 2.0
    back_linear_speed: -0.15
    back_angular_kp: 1.8
    back_position_tolerance: 0.15
    back_path_sample_distance: 0.20
    back_timeout_sec: 10.0
    back_align_yaw_deg: 90.0
    back_align_tolerance_deg: 5.0
    back_align_timeout_sec: 10.0  # 增加到10s，90°原地转约需2-3s
    # 通道导航配置（目标点完全以 corridor_waypoints_json 最后一点为准，不再代码硬编码）
    map_topic: /map
    corridor_path_topic: /stage1_corridor_path
    enable_corridor_navigation: true
    corridor_waypoints_json: '[{"x":2.20,"y":2.25}]'
    corridor_waypoint_tolerance: 0.15
    corridor_goal_tolerance: 0.10
    corridor_goal_yaw_deg: 90.0
    corridor_goal_yaw_tolerance_deg: 25.0
    corridor_linear_speed: 0.14
    corridor_timeout_sec: 60.0
    pure_pursuit_lookahead_m: 0.45
    pure_pursuit_turn_kp: 1.8
    pure_pursuit_heading_stop_deg: 175.0
    use_corridor_planner: false
    planner_downsample: 4
    planner_occupied_threshold: 50
    planner_unknown_is_occupied: true
    planner_obstacle_inflation_m: 0.14
    planner_replan_period_sec: 0.5
