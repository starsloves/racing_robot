# S1 mission adapter parameters.  Motion parameters belong to stage1_nav2.yaml.
competition_controller:
  ros__parameters:
    map_topic: /map
    map_frame: map
    base_frame: base_footprint
    diagnostic_topic: start_corner_pose_diagnostic
    qr_result_topic: qr_scan_result
    task_topic: competition_qr_task
    stage1_state_topic: stage1_state
    stage2_entry_pose_topic: stage2_entry_pose
    route_topic: stage1_route
    mission_route_topic: stage1_mission_route
    planner_plan_topic: /planner_server/plan
    planner_plan_fallback_topic: /plan
    nav_base_frame: base_link
    navigate_action: /navigate_to_pose
    nav2_lifecycle_node: bt_navigator
    lifecycle_service_prefix: /competition/stage1

    # QR is a search waypoint.  The QR event, not reaching this point, ends
    # the first mission segment.
    qr_goal_x_m: 4.50
    qr_goal_y_m: 1.60
    qr_goal_yaw_deg: 0.0

    # Stage1 hands off at the fixed channel entry pose.  Direction is consumed
    # by Stage2; S1 always arrives with the nominal +Y heading.
    channel_entry_x_m: 2.50
    channel_entry_y_m: 2.50
    channel_entry_yaw_deg: 90.0
    # Narrow-lane return route: turn in below the wall, enter its center, then
    # settle at the S2 handoff pose. All points are map-frame parameters.
    # Enter the left half first; the last-run radar obstacle was near
    # map=(2.9,1.84), so a direct x=2.50 vertical approach is invalid.
    entry_align_x_m: 2.25
    entry_align_y_m: 1.50
    entry_align_yaw_deg: 90.0
    # Pre-validated forward-only waypoints keep each Dubins search local. They
    # steer below the QR area before entering the narrow center corridor.
    entry_turn_x_m: 4.55
    entry_turn_y_m: 1.35
    entry_turn_yaw_deg: 330.0
    entry_lower_turn_x_m: 4.45
    entry_lower_turn_y_m: 0.75
    entry_lower_turn_yaw_deg: 225.0
    entry_lower_approach_x_m: 3.50
    entry_lower_approach_y_m: 0.90
    entry_lower_approach_yaw_deg: 150.0
    entry_corridor_approach_x_m: 2.25
    entry_corridor_approach_y_m: 2.10
    entry_corridor_approach_yaw_deg: 90.0
    entry_corridor_x_m: 2.50
    entry_corridor_y_m: 2.10
    entry_corridor_yaw_deg: 90.0
    channel_entry_tolerance_m: 0.20
    channel_entry_yaw_tolerance_deg: 15.0
    entry_stable_sec: 0.25
    action_server_timeout_sec: 0.0
    goal_retry_delay_sec: 1.0
    goal_retry_limit: 3
    nav2_warmup_sec: 1.0
    initial_plan_timeout_sec: 3.0
    plan_stale_timeout_sec: 2.5
    path_deviation_abort_m: 0.22
    # Terminal and web both report the same map->base_footprint TF pose.
    pose_log_period_sec: 0.50
