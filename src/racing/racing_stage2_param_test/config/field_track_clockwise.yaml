# field_track_clockwise.yaml — 顺时针矩形赛道段定义
# 角度：正=左转(+ω)，负=右转(-ω)
# 入口先左转 91°（≈90°+1°补偿），四个拐角依次右转
# 边长根据实测标定

track_type: rectangle_closed
direction: clockwise

segments:
  # ── 入口对齐 ────────────────────────────────────────
  # Stage1 结束车头朝 Y+（ψ=90°），左转 91° 进入赛道
  - type: turn
    angle_deg: 90.0
    description: rect_enter_align

  # ── 第一段（底边向左） ──────────────────────────────
  - type: move
    distance_m: 1.05
    description: rect_first_leg

  # ── 左下拐角 ────────────────────────────────────────
  - type: turn
    angle_deg: -90.0
    description: rect_corner_1

  # ── 第二段（左边向上） ──────────────────────────────
  - type: move
    distance_m: 0.385
    description: rect_side_1

  # ── 左上拐角 ────────────────────────────────────────
  - type: turn
    angle_deg: -90.0
    description: rect_corner_2

  # ── 第三段（顶边向右） ──────────────────────────────
  - type: move
    distance_m: 2.90
    description: rect_top

  # ── 右上拐角 ────────────────────────────────────────
  - type: turn
    angle_deg: -90.0
    description: rect_corner_3

  # ── 第四段（右边向下） ──────────────────────────────
  - type: move
    distance_m: 0.36
    description: rect_side_2

  # ── 右下拐角 ────────────────────────────────────────
  - type: turn
    angle_deg: -90.0
    description: rect_corner_4

  # ── 第五段（底边回起点） ────────────────────────────
  - type: move
    distance_m: 1.05
    description: rect_return_origin