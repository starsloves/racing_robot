# avoid_controller.yaml — 避障控制器参数
# 独立于测试执行参数，方便单独调参

stage2_inertial_navigator:
  ros__parameters:
    # ── 转角参数 ──────────────────────────────────────
    # avoid_turn_away_deg: 从原航向转开的角度（第一拐）
    # avoid_turn_back_deg: 回到原航向另一侧的角度（第二拐落点）
    # avoid_recover_deg: 回正转角（从 psi2 转到 psi3）
    #     默认=back_deg 即回到 psi0；调大可补偿打滑
    avoid_turn_away_deg: 30.0
    avoid_turn_back_deg: 40.0
    avoid_recover_deg: 10.0

    # ── 直腿距离 ──────────────────────────────────────
    # leg1: turn_away 后的直行长度
    # leg2: turn_back 后的直行长度
    avoid_leg1_distance_m: 0.22
    avoid_leg2_distance_m: 0.22

    # ── 侧边触发 ─────────────────────────────────────
    # left/right_clearance < 此值 → 触发侧边避障
    side_detour_threshold_m: 0.18

    # ── 避障转弯到位精度 ────────────────────────────
    avoider_heading_tolerance_deg: 1.5

    # ── 直行障碍检测（从 inertial_stage2.yaml 移来）─
    detour_obstacle_distance: 0.52      # 直行段前方障碍触发距离(m)
    detour_front_angle_deg: 18.0        # 前方检测扇形半角(°)
    detour_side_center_deg: 65.0        # 侧方检测中心角(°)
    detour_side_window_deg: 30.0        # 侧方检测窗口宽度(°)

    # ── 转弯/接近拐角障碍检测（新增） ──────────────
    turn_obstacle_stop_m: 0.25          # 转弯时/接近拐角时的障碍触发距离(m)
                                        # 比直行 0.48 更短，避免雷达扫边误触发
    corner_approach_m: 0.15             # 直行段末尾提前切换检测方案的距离(m)
    turn_obstacle_creep_speed: 0.02     # 触发时的最小蠕行速度(m/s)，防止电机停转
