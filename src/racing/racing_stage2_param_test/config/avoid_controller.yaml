# avoid_controller.yaml — 避障控制器参数
# 独立于测试执行参数，方便单独调参

stage2_inertial_navigator:
  ros__parameters:
    # ── 转角参数 ──────────────────────────────────────
    # 所有角度都是【增量】（转多少度），不是绝对值（转到多少度）
    # 
    # avoid_turn_away_deg:   从原始航向ψ₀【偏开】的角度（第一拐）
    #                        公式: ψ₁ = ψ₀ + sign × away
    # 
    # avoid_turn_back_deg:   从偏开位置ψ₁【往回转】的角度（第二拐）
    #                        公式: ψ₂ = ψ₁ - sign × back
    #                        实际转角 = back（不是 away+back！）
    # 
    # avoid_recover_deg:     从回转位置ψ₂【回正】的角度（第三拐）
    #                        公式: ψ₃ = ψ₂ + sign × recover
    #                        目的: 回到接近原始航向ψ₀
    # 
    # 示例(障碍在右，ψ₀=90°, away=40, back=50, recover=15):
    #   ψ₀=90° → ψ₁=130°(偏开40°) → ψ₂=80°(回转50°) → ψ₃=95°(回正15°)
    #   
    avoid_turn_away_deg: 40.0
    avoid_turn_back_deg: 80.0
    avoid_recover_deg: 45.0

    # ── 直腿距离 ──────────────────────────────────────
    # leg1: turn_away 后的直行长度
    # leg2: turn_back 后的直行长度
    avoid_leg1_distance_m: 0.20
    avoid_leg2_distance_m: 0.30

    # ── 侧边触发 ─────────────────────────────────────
    # left/right_clearance < 此值 → 触发侧边避障
    side_detour_threshold_m: 0.18

    # ── 避障转弯到位精度 ────────────────────────────
    avoider_heading_tolerance_deg: 1.5

    # ── 直行障碍检测（从 inertial_stage2.yaml 移来）─
    detour_obstacle_distance: 0.55      # 前方障碍检测距离（触发避障判断）
    
    detour_front_angle_deg: 18.0        # 前方检测扇形半角(°)
    detour_side_center_deg: 65.0        # 侧方检测中心角(°)
    detour_side_window_deg: 30.0        # 侧方检测窗口宽度(°)
    
    # ── 航向门限 ─────────────────────────────────────
    # 偏航超过此角度时抑制避障触发（防止歪着避障）
    detour_heading_gate_deg: 25.0       # 从默认 12° 放宽到 25°（防止打滑锁死）

    # ── 转角避障（obstacle in corner） ────────────────────
    # 当段末空间不足以正常避障时，用单腿斜边直接绕过拐角并跳段
    corner_trigger_remaining_m: 0.60    # 段末剩余路程阈值（≤此值触发转角避障）
                                        # 实测调整
    
    corner_turn_away_deg: 30.0          # 转角避障：偏离角（45° 等腰直角三角形）
    corner_turn_back_deg: 45.0          # 转角避障：回转角
    corner_leg_distance_m: 0.40         # 转角避障：斜边长度（从 0.778 降至 0.40 防越界）
