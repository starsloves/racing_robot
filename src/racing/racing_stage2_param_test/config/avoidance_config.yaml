# 单线雷达避障主方案配置
# 通过 direct_inertial_test.launch.py 自动加载

stage2_inertial_navigator:
  ros__parameters:

    control_rate_hz: 30.0

    # 单一主方案：N10 单雷达 + 段坐标局部轨迹 + 绕障追踪 + 回归阻尼
    avoidance_trigger_distance_m: 0.72
    avoidance_confirm_frames: 2
    avoidance_cooldown_sec: 2.0

    avoidance_linear_speed: 0.10
    avoidance_min_linear_speed: 0.06
    avoidance_merge_linear_speed: 0.06
    avoidance_omega_speed_scale: 0.85
    avoidance_max_omega: 0.75
    avoidance_max_omega_rate: 2.4

    avoidance_lookahead_m: 0.16
    avoidance_heading_kp: 2.6
    avoidance_cross_kp: 3.8
    avoidance_bypass_cross_kp: 5.2
    avoidance_bypass_heading_kp: 3.2
    avoidance_merge_heading_kp: 3.0
    avoidance_merge_cross_kp: 5.2
    avoidance_bypass_heading_deg: 16.0

    avoidance_base_clearance_m: 0.17
    avoidance_obstacle_inflate_m: 0.10
    avoidance_max_clearance_m: 0.28

    avoidance_shift_distance_m: 0.30
    avoidance_pass_margin_m: 0.14
    avoidance_merge_distance_m: 0.36
    avoidance_max_projection_m: 1.00

    avoidance_finish_heading_tol_deg: 5.0
    avoidance_finish_cross_tol_m: 0.05

    avoidance_side_blocked_threshold_m: 0.30
    avoidance_side_clear_threshold_m: 0.42
    avoidance_lateral_confirm_frames: 2
    avoidance_front_angle_bias_deg: 6.0
    avoidance_min_front_clearance_m: 0.18
    avoidance_front_escape_distance_m: 0.28
    avoidance_early_shift_margin_m: 0.08
    avoidance_early_shift_ratio: 0.72
    avoidance_merge_front_clear_distance_m: 0.85
    avoidance_merge_min_offset_ratio: 0.55
    avoidance_merge_min_progress_ratio: 0.40
    avoidance_merge_spin_heading_deg: 18.0
    avoidance_merge_creep_heading_deg: 10.0
    avoidance_merge_creep_speed: 0.03
    avoidance_merge_hold_zero_cross_m: 0.12
    avoidance_merge_release_heading_deg: 8.0
    avoidance_timeout_sec: 7.0
