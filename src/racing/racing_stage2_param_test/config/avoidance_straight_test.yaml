# 直行避障台架：脚1 0.30m + 脚2 0.40m（沿航向里程），回 ψ₀
# 位姿/航向/计程/控制统一用 /odom

stage2_inertial_navigator:
  ros__parameters:
    navigation_pose_source: wheel
    wheel_odom_topic: /odom
    wheel_odom_warmup_sec: 0.40
    wheel_odom_warmup_min_msgs: 5
    use_corridor_path: false
    pre_loop_plan_json: '[]'
    post_corridor_path_plan_json: '[]'

    test_feedback_prefix: 避障直行测试
    straight_distance_m: 3.0
    straight_speed: 0.20
    straight_settle_sec: 0.30
    repeat_straight: false
    segment_timeout: 60.0

    detour_enabled: true
    detour_obstacle_distance: 0.48
    detour_front_angle_deg: 35.0
    detour_side_center_deg: 65.0
    detour_side_window_deg: 16.0
    detour_min_side_clearance: 0.55

    avoid_leg_heading_offset_deg: 30.0
    avoid_leg1_distance_m: 0.30
    avoid_leg2_distance_m: 0.40
    avoid_leg_linear_speed: 0.10
    avoid_leg_distance_tol_m: 0.04
    avoid_turn_angular_speed: 0.40
    avoid_turn_settle_sec: 0.35
    avoid_telemetry_interval_sec: 0.20

    session_log_subdir: avoidance_straight_test
    session_log_filename: latest.log
