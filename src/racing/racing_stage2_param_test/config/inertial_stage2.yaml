# inertial_stage2.yaml — 第二阶段惯导导航基础参数（官方）
# 本文件来自 racing_stage2/config/inertial_stage2.yaml，在此作为本地副本
# 被 direct_inertial_test.launch.py 加载
#
# 参数加载优先级（后加载覆盖前）：
#   1. inertial_stage2.yaml  ← 本文件（基础参数）
#   2. direct_inertial_test.yaml  ← 测试执行覆盖
#   3. avoid_controller.yaml  ← 避障专用覆盖
#
# detour_obstacle_distance / detour_front_angle_deg / detour_side_center_deg / detour_side_window_deg
# 已移到 avoid_controller.yaml，由该文件统一管理

stage2_inertial_navigator:
  ros__parameters:
    # ── Topic 配置 ────────────────────────────────────
    phase_topic: competition_phase           # 赛程阶段话题（外部输入）
    task_topic: competition_qr_task          # 扫码任务话题（外部输入）
    odom_topic: /odom_combined               # EKF 里程计（导航定位）
    imu_topic: /imu/data                     # IMU 九轴数据
    map_topic: /map                          # 栅格地图
    scan_topic: /scan                        # 激光雷达扫描
    cmd_topic: /stage2_cmd_vel               # 速度指令输出话题（→ twist_cmd_relay → /cmd_vel）
    corridor_path_topic: /stage2_corridor_path  # 通道规划路径话题
    feedback_topic: competition_feedback     # 反馈话题（给 Stage1/3 用）
    state_topic: stage2_state                # 状态发布话题

    # ── 控制频率 ──────────────────────────────────────
    control_rate_hz: 20.0                    # 控制循环频率（Hz）
    start_delay_sec: 50.0                     # 位姿就绪后的启动延迟（s）

    # ── 直行速度 ──────────────────────────────────────
    corridor_linear_speed: 0.14              # 通道段直行速度（m/s）
    ring_linear_speed: 0.3                   # 环形赛道直行速度（m/s）

    # ── 转弯控制 ──────────────────────────────────────
    # 以下3项被 direct_inertial_test.yaml 覆盖：
    #   turn_angular_speed → 0.80, turn_min_angular_speed → 0.30, turn_kp → 2.0
    turn_linear_speed: 0.10                  # 转弯时前向速度（m/s）
    turn_angular_speed: 0.65                 # 被 direct_inertial_test.yaml 覆盖为 0.80
    turn_min_angular_speed: 0.45             # 被 direct_inertial_test.yaml 覆盖为 0.18
    turn_kp: 1.8                             # 被 direct_inertial_test.yaml 覆盖为 2.0
    heading_kp: 2.0                          # 直行航向保持比例增益（从 0.5 改为 2.0，增强修正）
    max_angular_speed: 0.8                   # 角速度上限（rad/s）

    # ── 到位精度 ──────────────────────────────────────
    distance_tolerance: 0.04                 # 直行到位判据（m）
    heading_tolerance_deg: 3.5               # 被 direct_inertial_test.yaml 覆盖为 1.5
    segment_timeout: 25.0                    # 单段超时时间（s）

    # ── 方向解析（扫码结果 → 行驶方向） ────────────────
    odd_is_clockwise: true                   # 奇偶规则：奇数圈=顺时针
    clockwise_keywords: 顺时针,cw,clockwise          # 顺时针触发关键词
    counterclockwise_keywords: 逆时针,ccw,counterclockwise  # 逆时针触发关键词

    # ── 通道导航 ──────────────────────────────────────
    use_corridor_path: true                  # 是否使用通道路径规划
    corridor_waypoints_are_global: true      # 路点在 map 坐标系下
    global_frame_id: map                     # 全局坐标系
    corridor_waypoints_json: '[{"x":2.50,"y":3.20,"speed":0.12,"yaw_deg":90.0,"description":"corridor_goal"}]'  # 通道终点（入口坐标）
    corridor_waypoint_tolerance: 0.18        # 路过点容差（m）
    corridor_goal_tolerance: 0.10            # 终点容差（m）
    corridor_goal_standoff_m: 0.18           # 终点前停车距离（m）
    corridor_goal_yaw_tolerance_deg: 6.0     # 终点航向容差（°）

    # ── 纯追踪（通道内路径跟踪） ───────────────────────
    corridor_path_timeout_sec: 45.0          # 通道路径超时（s）
    pure_pursuit_lookahead_m: 0.45           # 纯追踪前视距离（m）
    pure_pursuit_heading_stop_deg: 70.0      # 航向差大于此值停止纯追踪（°）
    pure_pursuit_turn_kp: 1.8                # 纯追踪转向增益

    # ── 栅格规划器（通道内避障路径重规划） ─────────────
    use_occupancy_grid_planner: true         # 是否启用栅格规划
    planner_downsample: 4                    # 地图降采样倍率
    planner_occupied_threshold: 50           # 占据阈值（0-100）
    planner_unknown_is_occupied: true        # 未知区域视为障碍
    planner_obstacle_inflation_m: 0.14       # 障碍膨胀半径（m）
    planner_dynamic_obstacle_box_size_m: 0.25  # 动态障碍物框大小（m）
    planner_dynamic_obstacle_inflation_m: 0.04  # 动态障碍膨胀（m）
    planner_dynamic_obstacle_range_m: 0.7    # 动态障碍检测范围（m）
    planner_replan_period_sec: 0.25          # 重规划周期（s）

    # ── 通道预循环控制 ────────────────────────────────
    corridor_path_skip_pre_loop_plan: true   # 是否跳过 pre_loop（已由总启动处理）

    post_corridor_path_plan_json: '[{"type":"pause","duration":0.20,"description":"corridor_arrive_settle"}]'  # 被 direct_inertial_test.yaml 覆盖为相同值
    pre_loop_plan_json: '[{"type":"turn","angle_deg":90.0,"description":"scan_leave_1"},{"type":"move","distance_m":0.18,"speed":0.08,"description":"scan_leave_2","allow_detour":false},{"type":"turn","angle_deg":90.0,"description":"to_corridor_axis"},{"type":"move","distance_m":1.20,"speed":0.12,"description":"corridor_staging","allow_detour":true},{"type":"pause","duration":0.15,"description":"corridor_staging_settle"},{"type":"pause","duration":0.10,"description":"loop_entry_settle"}]'  # 被 direct_inertial_test.yaml 覆盖为 '[]'

    # ── 环形赛道几何（用于矩形赛道规划） ──────────────
    loop_long_length_m: 3.42                 # 赛道长边（m）
    loop_short_length_m: 1.08                # 赛道短边（m）
    exit_distance_m: 1.05                    # 出口段长度（m）

    # ── 通道避障（回避障控制器覆盖） ──
    # detour_obstacle_distance、detour_front_angle_deg 等已移到 avoid_controller.yaml
    detour_enabled: true                     # 是否启用 detour
    detour_min_side_clearance: 0.55          # 侧边最小余量（m）
    detour_lateral_distance_m: 0.32          # 侧移距离（m）
    detour_forward_distance_m: 0.75          # 绕行前向距离（m）
    detour_cooldown_sec: 2.0                 # 避障冷却时间（s）
    obstacle_circle_min_radius_m: 0.10       # 障碍物最小圆半径（m）

    # ── 视觉车道居中 ──────────────────────────────────
    vision_enabled: true                     # 是否启用视觉修正（move 段 + leg2 段）
    vision_model_path: /home/sunrise/dev_ws/src/racing/racing_stage2_param_test/models/bset.bin  # BPU 模型路径
    vision_conf_thres: 0.25                  # 检测置信度阈值
    vision_iou_thres: 0.45                   # NMS IOU 阈值
    vision_crop_ratio: 0.4                   # 图像裁剪比例（保留下方 40%）
    vision_offset_kp: 0.2                    # offset → angular 增益（大幅降低，防止过冲）
    vision_max_angular: 0.5                  # 视觉修正最大角速度（降回 0.6，避免过度修正）
    vision_web_enabled: true                 # 是否启动 Web 服务（实时查看）
    vision_web_port: 8080                    # Web 服务端口
