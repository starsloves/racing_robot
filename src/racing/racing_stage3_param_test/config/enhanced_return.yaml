enhanced_return_navigator:
  ros__parameters:
    # ===== Topic =====
    phase_topic: competition_phase
    odom_topic: /odom_combined
    scan_topic: /scan
    cmd_topic: /cmd_vel
    state_topic: stage3_state
    feedback_topic: competition_feedback

    # ===== 控制 =====
    control_rate_hz: 20.0
    start_delay_sec: 0.5

    # ===== 路点（map 全局坐标系）====
    # Stage2 结束位置: (2.50, 2.95) map 坐标
    # P 点目标坐标: (0.20, 0.20) map 坐标
    #
    # 路径：起点 → P点 直线，避障保持
    return_waypoints_json: '[{"x":0.20,"y":0.20,"speed":0.15,"yaw_deg":100.0,"description":"P_point"}]'
    waypoint_tolerance: 0.18
    goal_tolerance: 0.10
    goal_yaw_tolerance_deg: 6.0
    path_timeout_sec: 60.0

    # ===== Pure Pursuit =====
    pursuit_linear_speed: 0.18
    pursuit_lookahead_m: 0.45
    pursuit_heading_stop_deg: 70.0
    pursuit_turn_kp: 1.8
    pursuit_turn_linear_speed: 0.08    # 转弯时边转边走（不能为0）
    max_angular_speed: 0.8
    min_angular_speed: 0.45

    # ===== 避障（4态，同 Stage1）=====
    avoid_linear_speed: 0.10
    avoid_angular_speed: 0.80
    avoid_min_duration_sec: 0.70
    avoid_clear_hold_sec: 0.25
    avoid_min_turn_angle_deg: 18.0
    avoid_safe_distance: 0.50
    avoid_clear_distance: 0.65
    emergency_stop_distance: 0.08

    recovery_linear_speed: 0.12
    recovery_turn_linear_speed: 0.08
    recovery_angular_speed: 0.75
    recovery_heading_kp: 2.4
    recovery_max_angular_speed: 1.1
    recovery_min_angular_speed: 0.5
    recovery_in_place_angle_deg: 8.0
    recovery_timeout: 2.5
    recovery_duration_scale: 0.9

    counter_steer_linear_speed: 0.10
    counter_steer_angular_speed: 0.95
    counter_steer_duration_scale: 1.35
    counter_steer_min_duration_sec: 0.45
    counter_steer_max_duration_sec: 1.20

    # ===== 激光聚类窗口 =====
    window_min_x: 0.18
    window_max_x: 0.85
    window_half_width: 0.22
    cluster_gap_tolerance: 0.12
    min_cluster_points: 3
    min_cluster_width: 0.06
    max_cluster_width: 0.40
    min_valid_range: 0.15