simple_return_navigator:
  ros__parameters:
    # ===== Topic =====
    phase_topic: competition_phase
    imu_topic: /imu/data
    scan_topic: /scan
    cmd_topic: /stage3_cmd_vel
    state_topic: stage3_state

    # ===== 测试方向 =====
    # clockwise:       左转 +75°
    # counterclockwise: 右转 -105°
    test_direction: clockwise

    # ===== Phase 1：初始转向 =====
    turn_angular_speed: 1.0
    turn_heading_tolerance_deg: 3.0
    turn_kp: 2.0

    # ===== Phase 2：搜索墙角 =====
    search_linear_speed: 0.15        # 慢速前进扫描
    search_max_duration: 15.0        # 最长搜索时间（超时保底）

    # ===== Phase 3：对齐墙面（边走边转 θ→0）=====
    align_linear_speed: 0.15         # 对齐时前进速度
    align_kp: 2.0                    # 转向增益 angular = -kp * θ
    align_max_angular_speed: 0.6     # 最大转向角速度
    align_tolerance_deg: 10.0        # 对齐容差（|θ| < 此值视为对齐）
    align_hold_duration: 0.5         # 持续对齐此时长后切换

    # ===== Phase 4：垂直逼近（保持 θ≈0，距离控制）=====
    approach_target_cx: 0.3          # 目标 x（雷达坐标系）
    approach_target_cy: 0.7          # 目标 y
    approach_heading_kp: 2.0         # 航向修正增益
    approach_dist_kp: 0.5            # 距离控制增益
    approach_stop_tolerance_xy: 0.05 # 位置停止容差（m）
    approach_stop_tolerance_theta_deg: 5.0  # 角度停止容差
    approach_max_linear_speed: 0.25  # 最大逼近速度
    approach_min_linear_speed: 0.10  # 最小逼近速度
    corner_lost_timeout: 1.5         # 墙角丢失超时（回搜索）
    corner_lost_blind_speed: 0.12    # 丢失时盲走速度

    # ===== 墙角检测 =====
    douglas_peucker_epsilon: 0.05
    corner_min_line_length: 0.30
    corner_angle_tolerance_deg: 15.0
    corner_min_distance: 0.30
    corner_max_distance: 2.5
    corner_min_points: 8

    # ===== 锥桶分类 =====
    cone_max_width: 0.15
    cone_max_distance: 0.80
    cone_avoidance_trigger: 0.40
    wall_min_width: 0.30
    wall_detect_distance: 2.5

    # ===== 聚类窗口 =====
    phase1_window_min_x: 0.30
    phase1_window_max_x: 0.80
    phase1_window_half_width: 0.15
    phase1_min_cluster_points: 3
    min_valid_range: 0.25

    # ===== 避障 4态 =====
    avoid_linear_speed: 0.10
    avoid_angular_speed: 0.80
    avoid_min_duration_sec: 0.70
    avoid_clear_hold_sec: 0.25
    avoid_min_turn_angle_deg: 18.0

    recovery_linear_speed: 0.12
    recovery_turn_linear_speed: 0.08
    recovery_angular_speed: 0.75
    recovery_heading_kp: 2.4
    recovery_max_angular_speed: 1.1
    recovery_min_angular_speed: 0.5
    recovery_in_place_angle_deg: 8.0
    recovery_timeout: 2.5
    recovery_duration_scale: 0.9

    counter_steer_linear_speed: 0.10
    counter_steer_angular_speed: 0.95
    counter_steer_duration_scale: 1.35
    counter_steer_min_duration_sec: 0.45
    counter_steer_max_duration_sec: 1.20
