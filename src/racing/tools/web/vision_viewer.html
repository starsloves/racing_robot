<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>竞速机器人阶段视觉（内部服务页面）</title>
    <style>
        * { box-sizing: border-box; }
        body {
            margin: 0;
            min-height: 100vh;
            padding: 18px;
            background: #151515;
            color: #f5f5f5;
            font-family: "Segoe UI", Arial, sans-serif;
        }
        .header { max-width: 1100px; margin: 0 auto 14px; text-align: center; }
        h1 { margin: 0 0 10px; color: #00e676; font-size: 1.55rem; }
        .badge {
            display: inline-flex;
            align-items: center;
            gap: 8px;
            padding: 6px 13px;
            border: 1px solid #454545;
            border-radius: 18px;
            background: #252525;
            font-size: .9rem;
            font-weight: 700;
        }
        .dot { width: 10px; height: 10px; border-radius: 50%; background: #ff9800; }
        .dot.live { background: #00e676; box-shadow: 0 0 8px #00e676; }
        .dot.offline { background: #ff5252; }
        .dot.stale { background: #ff9800; }
        .pane {
            max-width: 1100px;
            margin: 0 auto;
            overflow: hidden;
            border: 3px solid #ff9800;
            border-radius: 9px;
            background: #000;
        }
        .pane.live { border-color: #00e676; box-shadow: 0 0 18px rgba(0, 230, 118, .22); }
        .pane.offline { border-color: #ff5252; }
        .pane-header {
            display: flex;
            justify-content: space-between;
            gap: 12px;
            padding: 8px 12px;
            background: #202020;
            font-size: .9rem;
            font-weight: 700;
        }
        .age { color: #aaa; font-weight: 400; }
        .age.live { color: #00e676; }
        .age.offline { color: #ff5252; }
        .age.stale { color: #ff9800; }
        .image-wrap { position: relative; min-height: 220px; }
        .image-wrap img { display: block; width: 100%; height: auto; }
        .loading {
            position: absolute;
            inset: 0;
            display: flex;
            align-items: center;
            justify-content: center;
            flex-direction: column;
            gap: 8px;
            background: rgba(0, 0, 0, .82);
            color: #00e676;
        }
        .loading small { color: #aaa; }
        .info {
            max-width: 1100px;
            margin: 14px auto 0;
            padding: 12px 16px;
            border-radius: 8px;
            background: #252525;
        }
        .row { display: flex; justify-content: space-between; padding: 5px 0; border-bottom: 1px solid #404040; }
        .row:last-child { border-bottom: 0; }
        .label { color: #aaa; }
        .value { color: #00e676; font-weight: 700; }
        .error { margin-top: 8px; color: #ff8a80; }
    </style>
</head>
<body>
    <header class="header">
        <h1 id="title">阶段视觉监控</h1>
        <span class="badge"><span id="dot" class="dot"></span><span id="status">检测中</span></span>
    </header>

    <section id="pane" class="pane">
        <div class="pane-header">
            <span id="stage-name">阶段视觉</span>
            <span id="age" class="age">-</span>
        </div>
        <div class="image-wrap">
            <img id="frame" alt="阶段视觉结果">
            <div id="loading" class="loading">
                <div>正在等待视觉服务...</div>
                <small>服务会在对应阶段启动</small>
            </div>
        </div>
    </section>

    <section class="info">
        <div class="row"><span class="label">服务端帧数</span><span id="server-frames" class="value">0</span></div>
        <div class="row"><span class="label">客户端帧数</span><span id="client-frames" class="value">0</span></div>
        <div class="row"><span class="label">轮询</span><span id="poll-info" class="value">初始化...</span></div>
        <div id="error" class="error"></div>
    </section>

    <script>
        const host = window.location.hostname || '127.0.0.1';
        const stageByPort = { '8082': 'stage2', '8083': 'stage3' };
        const stage = stageByPort[window.location.port] || 'stage2';
        const config = {
            stage2: { name: 'Stage 2 · 车道居中', port: 8082 },
            stage3: { name: 'Stage 3 · P点检测', port: 8083 }
        }[stage];
        const base = window.location.protocol === 'file:'
            ? `http://${host}:${config.port}`
            : window.location.origin;
        const frame = document.getElementById('frame');
        const loading = document.getElementById('loading');
        const pane = document.getElementById('pane');
        const dot = document.getElementById('dot');
        const age = document.getElementById('age');
        const status = document.getElementById('status');
        const error = document.getElementById('error');
        let clientFrames = 0;
        let pollCount = 0;
        let lastPoll = Date.now();
        let visualAvailable = false;

        document.getElementById('title').textContent = `${config.name} · 端口 ${config.port}`;
        document.getElementById('stage-name').textContent = config.name;

        function setState(kind, text, detail) {
            pane.className = `pane ${kind}`;
            dot.className = `dot ${kind}`;
            age.className = `age ${kind}`;
            status.textContent = text;
            age.textContent = detail;
            loading.style.display = kind === 'live' ? 'none' : 'flex';
            if (kind === 'offline') {
                loading.innerHTML = '<div>视觉服务离线</div><small>请确认对应阶段已经启动</small>';
            } else if (kind === 'stale') {
                loading.innerHTML = '<div>图像已过期</div><small>等待新的相机帧</small>';
            } else {
                loading.innerHTML = '<div>正在等待视觉服务...</div><small>服务会在对应阶段启动</small>';
            }
        }

        async function pollHealth() {
            const now = Date.now();
            const elapsed = now - lastPoll;
            lastPoll = now;
            pollCount += 1;
            try {
                const response = await fetch(`${base}/health?_t=${Date.now()}`, { cache: 'no-store' });
                if (!response.ok) throw new Error(`HTTP ${response.status}`);
                const data = await response.json();
                visualAvailable = true;
                const frameAge = data.frame_age_sec == null ? -1 : Number(data.frame_age_sec);
                document.getElementById('server-frames').textContent = String(data.frame_count || 0);
                if (frameAge < 0) setState('stale', '等待数据', '-');
                else if (frameAge < 2) setState('live', 'LIVE', `${frameAge.toFixed(2)}s`);
                else setState('stale', '过期', `${frameAge.toFixed(1)}s`);
                error.textContent = '';
            } catch (exc) {
                visualAvailable = false;
                setState('offline', '离线', '-');
                error.textContent = `连接失败：${exc}`;
            }
            document.getElementById('poll-info').textContent = `健康检查 #${pollCount} · 间隔 ${elapsed}ms`;
            setTimeout(pollHealth, 1000);
        }

        function refreshFrame() {
            if (visualAvailable) {
                frame.src = `${base}/vision_latest.jpg?t=${Date.now()}`;
            }
            setTimeout(refreshFrame, 150);
        }

        frame.addEventListener('load', () => {
            clientFrames += 1;
            document.getElementById('client-frames').textContent = String(clientFrames);
        });
        setState('stale', '等待数据', '-');
        pollHealth();
        refreshFrame();
    </script>
</body>
</html>
