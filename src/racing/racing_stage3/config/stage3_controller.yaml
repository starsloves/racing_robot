# Stage3: MAP_SEARCH -> VISUAL_APPROACH -> TERMINAL_COMMIT -> COMPLETE
stage3_return_navigator:
  ros__parameters:
    odom_topic: /odom_combined
    imu_topic: /imu/data
    scan_topic: /scan
    cmd_topic: /cmd_vel
    state_topic: stage3_state
    feedback_topic: competition_feedback
    direction_topic: competition_qr_task
    stage3_entry_anchor_topic: stage3_entry_anchor
    lifecycle_service_prefix: /competition/stage3
    require_stage3_entry_anchor: true
    stage3_entry_map_yaw_deg: -90.0
    control_rate_hz: 20.0
    start_delay_sec: 0.0

    # Map search generates one minimum-radius entry arc, then its tangent
    # straight segment toward the visual search area.  It never completes on map data.
    path_timeout_sec: 60.0
    search_target_map_x_m: 0.50
    search_target_map_y_m: 0.20
    search_linear_speed: 0.20
    search_min_turn_radius_m: 0.42
    search_lookahead_m: 0.35
    search_angular_slew_rate_rad_s2: 0.90

    # P detector and continuous visual steering.
    p_model_path: /home/sunrise/dev_ws/src/racing/racing_stage3/models/best_p.bin
    p_conf_thres: 0.25
    p_iou_thres: 0.45
    p_crop_ratio: 0.40
    p_web_port: 8083
    p_detection_timeout_sec: 0.35
    p_approach_conf_threshold: 0.50
    p_approach_consecutive_hits: 2
    p_approach_linear_speed: 0.30
    p_approach_min_linear_speed: 0.18
    p_offset_filter_alpha: 0.55
    p_centering_angular_gain: 0.52
    p_centering_max_angular_speed: 0.38
    p_centering_slew_rate_rad_s2: 0.70
    p_centering_slow_offset: 0.20
    p_visual_loss_grace_sec: 0.45

    # Wide terminal acceptance: half-body occupancy is sufficient; no late turn.
    terminal_conf_threshold: 0.50
    terminal_fill_ratio: 0.35
    terminal_center_offset: 0.40
    terminal_evidence_hold_sec: 0.15
    terminal_linear_speed: 0.14
    terminal_loss_hold_sec: 0.35

    # Unknown obstacles are safety holds during MAP_SEARCH only.
    search_emergency_distance_m: 0.28
    search_emergency_half_width_m: 0.12
    search_emergency_min_x_m: 0.08
    search_emergency_max_x_m: 0.45
