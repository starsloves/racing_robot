# field_track_clockwise.yaml — 顺时针矩形赛道（绝对坐标+标准90°）
# 坐标系：map 世界坐标系
# 起点：Stage1 终点 (2.50, 2.60), yaw=90°（朝向 +Y）
# 所有角点坐标经过精确计算，形成标准矩形

track_type: rectangle_closed
direction: clockwise
coordinate_system: world  # 使用世界坐标系

# Stage1 终点 = Stage2 入口
start_pose:
  x: 2.50
  y: 2.60
  yaw_deg: 90.0

segments:
  # ── 入口转弯 ────────────────────────────────────────
  # 在 (2.50, 2.60) 原地左转 90°，转后朝向 180°（-X）
  - type: turn
    angle_deg: 90.0
    description: rect_enter_align

  # ── 第一段：从入口向左直行到矩形左边 ──────────────
  # 从 (2.50, 2.60) 沿 180° 走 1.05m 到 (1.45, 2.60)
  - type: move
    target: {x: 1.45, y: 2.60}
    description: rect_first_leg

  # ── 左下拐角 ────────────────────────────────────────
  # 在 (1.45, 2.60) 右转 90°，转后朝向 90°（+Y）
  - type: turn
    angle_deg: -90.0
    description: rect_corner_1

  # ── 第二段：矩形左边向上 ────────────────────────────
  # 从 (1.45, 2.60) 沿 90° 走 0.80m 到 (1.45, 3.40)
  - type: move
    target: {x: 1.45, y: 3.40}
    description: rect_side_1

  # ── 左上拐角 ────────────────────────────────────────
  # 在 (1.45, 3.40) 右转 90°，转后朝向 0°（+X）
  - type: turn
    angle_deg: -90.0
    description: rect_corner_2

  # ── 第三段：矩形顶边向右 ────────────────────────────
  # 从 (1.45, 3.40) 沿 0° 走 2.90m 到 (4.35, 3.40)
  - type: move
    target: {x: 4.35, y: 3.40}
    description: rect_top

  # ── 右上拐角 ────────────────────────────────────────
  # 在 (4.35, 3.40) 右转 90°，转后朝向 -90°（-Y）
  - type: turn
    angle_deg: -90.0
    description: rect_corner_3

  # ── 第四段：矩形右边向下 ────────────────────────────
  # 从 (4.35, 3.40) 沿 -90° 走 0.80m 到 (4.35, 2.60)
  - type: move
    target: {x: 4.35, y: 2.60}
    description: rect_side_2

  # ── 右下拐角 ────────────────────────────────────────
  # 在 (4.35, 2.60) 右转 90°，转后朝向 180°（-X）
  - type: turn
    angle_deg: -90.0
    description: rect_corner_4

  # ── 第五段：矩形底边回到入口 ────────────────────────
  # 从 (4.35, 2.60) 沿 180° 走 2.90m 回到 (1.45, 2.60)
  # 注意：这里会回到矩形左边，而不是最初的 (2.50, 2.60)
  # 如果要回到初始点，需要再走 1.05m 到 (2.50, 2.60)
  - type: move
    target: {x: 1.45, y: 2.60}
    description: rect_return_left_corner

  # ── 左下拐角（第二次）──────────────────────────────
  # 在 (1.45, 2.60) 左转 90°（反方向），转后朝向 90°（+Y）
  # 准备退出矩形，返回初始点
  - type: turn
    angle_deg: 90.0
    description: rect_exit_align

  # ── 最后一段：返回初始点 ────────────────────────────
  # 从 (1.45, 2.60) 沿 0° 走 1.05m 回到 (2.50, 2.60)
  - type: move
    target: {x: 2.50, y: 2.60}
    description: rect_return_origin
