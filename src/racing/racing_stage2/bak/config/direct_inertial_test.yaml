# 惯导参数测试：位姿/航向/计程/控制统一用轮速 /odom（与 origincar_base 编码器同源）
# /odom_combined 仅作对比日志，不参与导航

stage2_inertial_navigator:
  ros__parameters:
    navigation_pose_source: wheel
    wheel_odom_topic: /odom
    odom_topic: /odom_combined
    wheel_odom_warmup_sec: 0.40
    wheel_odom_warmup_min_msgs: 5

    use_corridor_path: false
    pre_loop_plan_json: '[]'
    post_corridor_path_plan_json: '[]'

    session_log_subdir: direct_inertial_test
    session_log_filename: latest.log
    session_telemetry_interval_sec: 0.25

    # 转弯控制：容差 0.8° + 减小减速区间 + 末端角速度 50%
    # 问题：corner_2 多转 2.7°、corner_3 多转 1.6°（0.5° 容差过紧导致过冲）
    # 调整：容差 0.5° → 0.8°，末端角速度 60% → 50%（减少过冲）
    heading_tolerance_deg: 3.0        # 0.8° → 3.0°，提前停让惯性自然冲到目标
    turn_angular_speed: 0.80          # 保持 0.80 rad/s
    turn_min_angular_speed: 0.30      # 保持 0.30 rad/s（最小角速度下限）
    turn_kp: 2.0                      # 保持 2.0
    turn_slowdown_threshold_deg: 10.0 # 保持 10°，更晚减速
    turn_min_speed_ratio: 0.5         # 0.6 → 0.5，末端保持 50% 角速度（减少过冲）
    
    # === 新增：融合与渐变参数 ===
    # IMU 航向控制参数
    imu_heading_deadzone_deg: 0.3     # IMU 航向死区（从 1.0° 缩小到 0.3°，更敏感）
    imu_max_yaw_rate_deg_s: 600.0     # IMU 异常检测阈值（10°/s 跳变）
    
    # 视觉超时
    vision_timeout_sec: 0.5           # 视觉数据超时时间
    
    # 加速渐变参数（转弯后平滑过渡）
    move_accel_ramp_sec: 0.5          # 转弯后加速渐变时长（秒）
