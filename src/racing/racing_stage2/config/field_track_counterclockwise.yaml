# field_track_counterclockwise.yaml — 逆时针矩形赛道（四个矩形拐角标准90°）
# 导航方式：odom 相对坐标 + 欧氏距离，直行段禁用航向修正
# 起点：Stage1 终点，车头朝向 90°（+Y）
# 四个矩形拐角按标准 90° 执行；入口转角按当前实测配置

track_type: rectangle_closed
direction: counterclockwise

segments:
  # ── 入口对齐 ────────────────────────────────────────
  # 原地右转 80°
  - type: turn
    angle_deg: -80.0
    description: rect_enter_align

  # ── 停稳（消除转弯残余角速度） ──────────────────────
  - type: pause
    duration: 0.05
    description: settle_after_enter

  # ── 第一段（底边向右） ──────────────────────────────
  - type: move
    distance_m: 0.60
    description: rect_first_leg

  # ── 停稳（消除直行段残余角速度） ────────────────────
  - type: pause
    duration: 0.05
    description: settle_before_corner_1

  # ── 右下拐角 ────────────────────────────────────────
  - type: turn
    angle_deg: 90.0
    description: rect_corner_1

  # ── 停稳（消除转弯残余角速度） ──────────────────────
  - type: pause
    duration: 0.05
    description: settle_after_corner_1

  # ── 第二段（右边向上） ──────────────────────────────
  - type: move
    distance_m: 0.20
    description: rect_side_1

  # ── 停稳（消除直行段残余角速度） ────────────────────
  - type: pause
    duration: 0.05
    description: settle_before_corner_2

  # ── 右上拐角 ────────────────────────────────────────
  - type: turn
    angle_deg: 90.0
    description: rect_corner_2

  # ── 停稳（消除转弯残余角速度） ──────────────────────
  - type: pause
    duration: 0.05
    description: settle_after_corner_2

  # ── 第三段（顶边向左） ──────────────────────────────
  - type: move
    distance_m: 2.80
    description: rect_top

  # ── 停稳（消除直行段残余角速度） ────────────────────
  - type: pause
    duration: 0.05
    description: settle_before_corner_3

  # ── 左上拐角 ────────────────────────────────────────
  - type: turn
    angle_deg: 90.0
    description: rect_corner_3

  # ── 停稳（消除转弯残余角速度） ──────────────────────
  - type: pause
    duration: 0.05
    description: settle_after_corner_3

  # ── 第四段（左边向下） ──────────────────────────────
  - type: move
    distance_m: 0.20
    description: rect_side_2

  # ── 停稳（消除直行段残余角速度） ────────────────────
  - type: pause
    duration: 0.05
    description: settle_before_corner_4

  # ── 左下拐角 ────────────────────────────────────────
  - type: turn
    angle_deg: 90.0
    description: rect_corner_4

  # ── 停稳（消除转弯残余角速度） ──────────────────────
  - type: pause
    duration: 0.05
    description: settle_after_corner_4

  # ── 返回起点 ────────────────────────────────────────
  - type: move
    distance_m: 0.60
    description: rect_return_origin
