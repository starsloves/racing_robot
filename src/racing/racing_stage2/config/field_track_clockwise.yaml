# 顺时针矩形赛道 — 固定舵角 + 固定持续时间控制
# 起点：Stage1区域进入后，名义车头约90°（+Y方向）

track_type: rectangle_closed
direction: clockwise

segments:
  # 入口对齐：左打舵15°，保持6秒，结束回正
  - type: arc
    steering_angle_deg: 15.0
    duration_sec: 6.0
    description: rect_enter_align

  # 底边右侧：向左直行0.90m
  - type: move
    distance_m: 0.90
    description: rect_first_leg

  # 左下拐角：右打舵15°，保持6秒，结束回正
  - type: arc
    steering_angle_deg: -15.0
    duration_sec: 6.0
    description: rect_corner_1

  # 右边向上：直行0.30m
  - type: move
    distance_m: 0.30
    description: rect_side_1

  # 右上拐角：右打舵15°，保持6秒，结束回正
  - type: arc
    steering_angle_deg: -15.0
    duration_sec: 6.0
    description: rect_corner_2

  # 顶边向左：直行2.80m
  - type: move
    distance_m: 2.80
    description: rect_top

  # 左上拐角：右打舵15°，保持6秒，结束回正
  - type: arc
    steering_angle_deg: -15.0
    duration_sec: 6.0
    description: rect_corner_3

  # 左边向下：直行0.30m
  - type: move
    distance_m: 0.30
    description: rect_side_2

  # 左下拐角：右打舵15°，保持6秒，结束回正
  - type: arc
    steering_angle_deg: -15.0
    duration_sec: 6.0
    description: rect_corner_4

  # 返回起点：直行0.90m
  - type: move
    distance_m: 0.90
    description: rect_return_origin
