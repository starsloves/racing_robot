# inertial_stage2.yaml — 第二阶段惯导导航基础参数（官方）
# 被 competition_stage2.launch.py 加载
#
# 参数加载优先级（后加载覆盖前）：
#   1. inertial_stage2.yaml  ← 本文件（基础参数）
#   2. avoid_controller.yaml  ← 避障专用覆盖
#
# detour_obstacle_distance / detour_front_angle_deg / detour_side_center_deg / detour_side_window_deg
# 已移到 avoid_controller.yaml，由该文件统一管理

stage2_inertial_navigator:
  ros__parameters:
    # ── Topic 配置 ────────────────────────────────────
    phase_topic: competition_phase           # 赛程阶段话题（外部输入）
    task_topic: competition_qr_task          # 扫码任务话题（外部输入）
    odom_topic: /odom_combined               # EKF 里程计（导航定位）
    imu_topic: /imu/data                     # IMU 九轴数据
    map_topic: /map                          # 栅格地图
    scan_topic: /scan                        # 激光雷达扫描
    cmd_topic: /stage2_cmd_vel               # 速度指令输出话题（→ twist_cmd_relay → /cmd_vel）
    corridor_path_topic: /stage2_corridor_path  # 通道规划路径话题
    feedback_topic: competition_feedback     # 反馈话题（给 Stage1/3 用）
    state_topic: stage2_state                # 状态发布话题

    # ── 控制频率 ──────────────────────────────────────
    control_rate_hz: 20.0                    # 控制循环频率（Hz）
    start_delay_sec: 0.5                     # 位姿就绪后的启动延迟（s）

    # ── 直行速度 ──────────────────────────────────────
    corridor_linear_speed: 0.14              # 通道段直行速度（m/s）
    ring_linear_speed: 0.32                  # 环形赛道直行速度（m/s），先降速纯惯导

    # ── 转弯控制 ──────────────────────────────────────
    # 以下3项官方生产值：
    #   turn_angular_speed → 0.80, turn_min_angular_speed → 0.30, turn_kp → 2.0
    turn_linear_speed: 0.07                  # 转弯时前向速度（m/s）
    turn_angular_speed: 0.80                 # 转弯角速度（rad/s）
    turn_min_angular_speed: 0.30             # 最小转弯角速度（rad/s）
    turn_kp: 2.0                             # 转弯比例增益
    heading_kp: 1.0                          # 直行航向保持比例增益（2.0 → 1.0，减小振荡）
    max_angular_speed: 0.8                   # 角速度上限（rad/s）

    # ── 到位精度 ──────────────────────────────────────
    distance_tolerance: 0.04                 # 直行到位判据（m）
    heading_tolerance_deg: 3.0               # 转弯到位容差（°）
    segment_timeout: 25.0                    # 单段超时时间（s）

    # ── 方向解析（扫码结果 → 行驶方向） ────────────────
    odd_is_clockwise: true                   # 奇偶规则：奇数圈=顺时针
    clockwise_keywords: 顺时针,cw,clockwise          # 顺时针触发关键词
    counterclockwise_keywords: 逆时针,ccw,counterclockwise  # 逆时针触发关键词

    # ── 通道导航 ──────────────────────────────────────
    use_corridor_path: false                  # 比赛默认 false：Stage1 已到入口
    corridor_waypoints_are_global: true      # 路点在 map 坐标系下
    global_frame_id: map                     # 全局坐标系
    corridor_waypoints_json: '[]'  # 通道路点（已由 Stage1 处理，此处清空）
    corridor_waypoint_tolerance: 0.18        # 路过点容差（m）
    corridor_goal_tolerance: 0.10            # 终点容差（m）
    corridor_goal_standoff_m: 0.18           # 终点前停车距离（m）
    corridor_goal_yaw_tolerance_deg: 6.0     # 终点航向容差（°）

    # ── 纯追踪（通道内路径跟踪） ───────────────────────
    corridor_path_timeout_sec: 45.0          # 通道路径超时（s）
    pure_pursuit_lookahead_m: 0.45           # 纯追踪前视距离（m）
    pure_pursuit_heading_stop_deg: 70.0      # 航向差大于此值停止纯追踪（°）
    pure_pursuit_turn_kp: 1.8                # 纯追踪转向增益

    # ── 栅格规划器（通道内避障路径重规划） ─────────────
    use_occupancy_grid_planner: true         # 是否启用栅格规划
    planner_downsample: 4                    # 地图降采样倍率
    planner_occupied_threshold: 50           # 占据阈值（0-100）
    planner_unknown_is_occupied: true        # 未知区域视为障碍
    planner_obstacle_inflation_m: 0.14       # 障碍膨胀半径（m）
    planner_dynamic_obstacle_box_size_m: 0.25  # 动态障碍物框大小（m）
    planner_dynamic_obstacle_inflation_m: 0.04  # 动态障碍膨胀（m）
    planner_dynamic_obstacle_range_m: 0.7    # 动态障碍检测范围（m）
    planner_replan_period_sec: 0.25          # 重规划周期（s）

    # ── 通道预循环控制 ────────────────────────────────
    corridor_path_skip_pre_loop_plan: true   # 是否跳过 pre_loop（已由总启动处理）

    post_corridor_path_plan_json: '[]'       # Stage1 已完成通道导航
    pre_loop_plan_json: '[]'                 # 比赛无 pre_loop

    # ── 环形赛道几何（用于矩形赛道规划） ──────────────
    loop_long_length_m: 3.42                 # 赛道长边（m）
    loop_short_length_m: 1.08                # 赛道短边（m）
    exit_distance_m: 1.05                    # 出口段长度（m）

    # ── 通道避障（回避障控制器覆盖） ──
    # detour_obstacle_distance、detour_front_angle_deg 等已移到 avoid_controller.yaml
    detour_enabled: true                     # 是否启用 detour
    detour_min_side_clearance: 0.55          # 侧边最小余量（m）
    detour_lateral_distance_m: 0.32          # 侧移距离（m）
    detour_forward_distance_m: 0.75          # 绕行前向距离（m）
    detour_cooldown_sec: 2.0                 # 避障冷却时间（s）
    obstacle_circle_min_radius_m: 0.10       # 障碍物最小圆半径（m）

    # ── 纠偏开关（直行段横向修正，三种模式，硬件 IMU 失效自动降级） ──
    imu_heading_correction_enabled: false     # IMU 航向纠偏
    vision_offset_correction_enabled: true  # 暂停使用 SEG 模型，Stage2 先只跑惯导
    fusion_mode_enabled: true               # 关闭视觉/融合纠偏，只保留惯导段序与避障
    fusion_weight_imu: 0.5                   # 融合模式中 IMU 权重（视觉无效时自动切 IMU 100%）
    fusion_weight_vision: 0.5                # 融合模式中视觉权重
    vision_model_path: /home/sunrise/dev_ws/src/racing/racing_stage2/models/bset.bin  # BPU 模型路径
    vision_conf_thres: 0.25                  # 检测置信度阈值
    vision_iou_thres: 0.45                   # NMS IOU 阈值
    vision_crop_ratio: 0.4                   # 仅下方 40% ROI 参与推理/纠偏/显示
    vision_offset_kp: 0.4                    # offset → angular 增益（大幅降低，防止过冲）
    vision_offset_max_sec: 1.0               # 单段视觉横向纠偏最长 1s，超时停用防过冲
    vision_max_angular: 0.8                  # 视觉修正最大角速度（降回 0.6，避免过度修正）
    vision_center_band: 0.12                 # 中心竖带宽度占画面宽比例（到位判据）
    vision_center_occ_thresh: 0.40           # 中心竖带 mask 占比 >= 此值视为已居中
    vision_centroid_bottom_ratio: 0.60       # 质心只用 ROI 底部该比例区域
    vision_web_enabled: true                 # 是否启动 Web 服务（实时查看）
    vision_web_port: 8082                    # 兼容旧名
    vision_http_port: 8082                   # 实际HTTP端口参数（Stage2）
    navigation_pose_source: wheel                 # 比赛统一位姿源：轮速 /odom
    wheel_odom_topic: /odom
    wheel_odom_warmup_sec: 0.40
    wheel_odom_warmup_min_msgs: 5
    session_log_subdir: competition_stage2
    session_log_filename: latest.log
    session_telemetry_interval_sec: 0.25
    test_feedback_prefix: 第二阶段
    imu_heading_deadzone_deg: 0.3
    imu_max_yaw_rate_deg_s: 600.0
    vision_timeout_sec: 0.5
    # ── 视觉纵向定长/修正（用 SEG mask 顶部位置粗估剩余距离）──
    vision_length_correction_enabled: true   # 启用后 move 段可按视觉修正目标长度
    vision_length_min_progress_ratio: 0.45   # 至少走完名义长度的该比例后才允许视觉提前结束
    vision_length_min_progress_m: 0.12       # 同时满足最小已走距离（m）
    vision_length_stop_remaining_m: 0.28     # 视觉剩余距离低于该值并连续确认后结束 move
    vision_length_confirm_frames: 3          # 连续确认帧数，防抖
    vision_length_max_shorten_ratio: 0.45    # 最多缩短名义长度的比例
    vision_length_max_extend_ratio: 0.25     # 最多延长名义长度的比例
    vision_length_max_extend_m: 0.35         # 最多延长的绝对距离（m）
    vision_range_near_m: 0.15                # mask 贴底时对应近距（m）
    vision_range_far_m: 2.50                 # mask 顶到画面顶部时对应远距（m）
    vision_range_center_band: 0.30           # 中心带宽度占画面比例
    vision_range_occ_thresh: 0.12            # 中心带行占用阈值
    move_accel_ramp_sec: 0.5
    turn_slowdown_threshold_deg: 10.0
    turn_min_speed_ratio: 0.5
