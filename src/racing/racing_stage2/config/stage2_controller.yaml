# Stage2 生产配置：距离仅用 /odom_combined XY，全部航向和转角仅用 /imu/data yaw。
# 段序固定：entry_arc -> entry_medium -> left_side_arc -> top_long -> right_side_arc
#           -> exit_medium -> exit_turn_90 -> stage3_handoff_line。
stage2_inertial_navigator:
  ros__parameters:
    # 固定话题与运行定义；正式比赛方向由 competition_qr_task 锁存。
    task_topic: competition_qr_task
    odom_topic: /odom_combined
    imu_topic: /imu/data
    imu_map_yaw_offset_topic: imu_map_yaw_offset
    imu_map_yaw_offset_fallback_enabled: false
    imu_map_yaw_offset_fallback_map_yaw_deg: 90.0
    scan_topic: /scan
    cmd_topic: /cmd_vel
    feedback_topic: competition_feedback
    state_topic: stage2_state
    # What: stage2_ai_capture_delay_after_turn_sec 是完成指定转弯后等待 AI 抓拍的时间。
    # Why: 0.20s 让车体角速度和图像拖影稳定；preset_* 是隔离测试文本，生产关闭。
    # Range: 0.10-0.80s；仅在 AI 抓拍模糊或错过目标时调整。
    # Impact: 增大可提升画面稳定性但延后抓拍；过小可能抓到转弯模糊帧。
    stage2_ai_capture_enabled: true
    stage2_ai_capture_delay_after_turn_sec: 0.20
    stage2_ai_trigger_topic: stage2_ai_capture
    stage2_ai_preset_enabled: false
    stage2_ai_preset_delay_after_turn_sec: 5.0
    stage2_ai_preset_clockwise_text: "病人躺在病床上吊水"
    stage2_ai_preset_counterclockwise_text: "医生和护士站在病房门口"
    stage2_ai_result_topic: ai_description
    control_rate_hz: 20.0
    control_gap_warn_sec: 0.35
    control_gap_stop_sec: 1.00
    command_heartbeat_rate_hz: 20.0
    stage2_vision_prewarm_on_task: true
    start_delay_sec: 0.0
    test_feedback_prefix: 第二阶段
    navigation_pose_source: ekf
    wheel_odom_topic: /odom
    wheel_odom_warmup_sec: 0.40
    wheel_odom_warmup_min_msgs: 5
    # 主速度与默认弯道速度。
    # What: track_max_speed/track_max_angular 是全局上限；track_<segment>_linear/ angular 分别是入口、左右侧 180deg 弯和出口 90deg 的命令速度。
    # Why: 默认值是方向覆盖缺失时的后备，0.70m/s 配 1.25-1.30rad/s 适合四个实测弯道。
    # Range: 直线 0.45-0.90m/s；弯道线速度 0.30-0.75m/s；弯道角速度 0.70-1.60rad/s。
    # Impact: 线速度增大使弯半径变大、可能压线；角速度增大转得更紧但会打滑或引发出弯摆动。先调线速度，再调角速度。
    # track_max_speed: 直线最高线速度；Why=缩短赛程；Range=0.45-0.90m/s；Impact=调大更快但弯前余量更小。
    track_max_speed: 0.80
    # track_max_angular: 全局角速度上限；Why=限制转向命令；Range=0.8-1.8rad/s；Impact=调大转弯更紧但更易打滑。
    track_max_angular: 1.5
    # track_entry_arc_linear: 入口 180deg 弯线速度；Why=入口姿态变化大需保守；Range=0.30-0.65m/s；Impact=调大易外甩。
    track_entry_arc_linear: 0.50
    # track_entry_arc_angular: 入口弯角速度；Why=决定转弯半径；Range=0.8-1.6rad/s；Impact=调大转得紧，过大抖动。
    track_entry_arc_angular: 1.25
    # track_left_side_arc_linear: 左侧 180deg 弯线速度；Why=按左弯标定；Range=0.30-0.75m/s；Impact=调大可能压外墙。
    track_left_side_arc_linear: 0.70
    # track_left_side_arc_angular: 左侧 180deg 弯角速度；Why=补偿左弯半径；Range=0.8-1.6rad/s；Impact=调大更贴内侧，过大蛇形。
    track_left_side_arc_angular: 1.30
    # track_right_side_arc_linear: 右侧 180deg 弯线速度；Why=按右弯标定；Range=0.30-0.75m/s；Impact=调大可能压外墙。
    track_right_side_arc_linear: 0.70
    # track_right_side_arc_angular: 右侧 180deg 弯角速度；Why=补偿右弯半径；Range=0.8-1.6rad/s；Impact=调大更贴内侧，过大蛇形。
    track_right_side_arc_angular: 1.30
    # track_exit_turn_90_linear: 出口 90deg 弯线速度；Why=交接前保持可控；Range=0.30-0.65m/s；Impact=调大交接位置误差增大。
    track_exit_turn_90_linear: 0.50
    # track_exit_turn_90_angular: 出口 90deg 弯角速度；Why=保证进入交接直线；Range=0.8-1.6rad/s；Impact=调大可能提前贴墙。
    track_exit_turn_90_angular: 1.25
    # What: track_<segment>_exit_lead_deg 是该弯相对 IMU 目标转角尚余多少度时，提前切入下一条直线；不是触发入弯的条件。
    # Why: 车辆有惯性，保留 25-45deg 可避免实际累计转到 180/90deg 后才切换而过转。
    # Range: 15-55deg；必须结合该段线/角速度调整。
    # Impact: 数值增大更早出弯，可能转角不足、直线向内偏；减小更晚出弯，可能过转、需要反向修正。
    # track_entry_arc_exit_lead_deg: 入口弯提前出弯角；Why=补偿惯性；Range=15-55deg；Impact=调大更早切直线，可能转角不足。
    track_entry_arc_exit_lead_deg: 45.0
    # track_left_side_arc_exit_lead_deg: 左侧弯提前出弯角；Why=左弯独立补偿；Range=15-55deg；Impact=调大欠转，调小过转。
    track_left_side_arc_exit_lead_deg: 32.0
    # track_right_side_arc_exit_lead_deg: 右侧弯提前出弯角；Why=右弯独立补偿；Range=15-55deg；Impact=调大欠转，调小过转。
    track_right_side_arc_exit_lead_deg: 35.0
    # track_exit_turn_90_exit_lead_deg: 出口提前出弯角；Why=保证交接直线航向；Range=15-55deg；Impact=调大可能航向未到位。
    track_exit_turn_90_exit_lead_deg: 45.0
    # 逆时针专属弯道覆盖。
    # What: track_counterclockwise_<segment>_* 覆盖默认弯道速度和提前出弯角，只在二维码结果为 counterclockwise 时生效。
    # Why: 逆时针的左右侧墙体、入弯姿态不同，保留独立标定，不能用另一方向的数值互换。
    # Range: 同默认弯道速度；exit_lead 15-55deg。出现单一逆时针弯过转/欠转时，只改对应 segment 的三个参数。
    # Impact: linear/ angular 增大分别使弯更快/更紧；exit_lead 增大更早切直线，减小更晚切直线。
    # 逆时针方向覆盖：仅二维码为 counterclockwise 时生效，linear/ angular/ exit_lead 分别调单段速度、转紧程度和出弯时机。
    # 每个参数都应只按对应弯的日志调整；Range=linear 0.30-0.75m/s，angular 0.8-1.6rad/s，exit_lead 15-55deg。
    # What=逆时针入口弯线速；Why=入口保守；Range=0.30-0.65m/s；Impact=调大外甩增大。
    track_counterclockwise_entry_arc_linear: 0.50
    # What=逆时针入口弯角速；Why=补偿半径；Range=0.8-1.6rad/s；Impact=调大更紧但易抖。
    track_counterclockwise_entry_arc_angular: 1.25
    # What=逆时针入口提前出弯角；Why=补偿惯性；Range=15-55deg；Impact=调大更早切直线。
    track_counterclockwise_entry_arc_exit_lead_deg: 45.0
    # What=逆时针左弯线速；Why=按左弯实测；Range=0.30-0.75m/s；Impact=调大压外墙风险增大。
    track_counterclockwise_left_side_arc_linear: 0.70
    # What=逆时针左弯角速；Why=按左弯半径；Range=0.8-1.6rad/s；Impact=调大更贴内侧。
    track_counterclockwise_left_side_arc_angular: 1.30
    # What=逆时针左弯提前出弯角；Why=防过转；Range=15-55deg；Impact=调大欠转，调小过转。
    track_counterclockwise_left_side_arc_exit_lead_deg: 29.0
    # What=逆时针右弯线速；Why=按右弯实测；Range=0.30-0.75m/s；Impact=调大横向余量变小。
    track_counterclockwise_right_side_arc_linear: 0.70
    # What=逆时针右弯角速；Why=按右弯半径；Range=0.8-1.6rad/s；Impact=调大转向更紧。
    track_counterclockwise_right_side_arc_angular: 1.43
    # What=逆时针右弯提前出弯角；Why=防过转；Range=15-55deg；Impact=调大更早切直线。
    track_counterclockwise_right_side_arc_exit_lead_deg: 30.5
    # What=逆时针出口弯线速；Why=交接前保守；Range=0.30-0.65m/s；Impact=调大交接位置误差增大。
    track_counterclockwise_exit_turn_90_linear: 0.50
    # What=逆时针出口弯角速；Why=对齐交接直线；Range=0.8-1.6rad/s；Impact=调大易过冲。
    track_counterclockwise_exit_turn_90_angular: 1.25
    # What=逆时针出口提前出弯角；Why=确保交接航向；Range=15-55deg；Impact=调大可能未到位。
    track_counterclockwise_exit_turn_90_exit_lead_deg: 45.0
    # 顺时针专属弯道覆盖：仅二维码结果为 clockwise 时生效，调参规则与逆时针相同。
    # 顺时针方向覆盖：仅二维码为 clockwise 时生效；Range 同逆时针，增大 angular 更紧，增大 exit_lead 更早出弯。
    # What=顺时针入口弯线速；Why=入口保守；Range=0.30-0.65m/s；Impact=调大外甩增大。
    track_clockwise_entry_arc_linear: 0.65
    # What=顺时针入口弯角速；Why=补偿半径；Range=0.8-1.6rad/s；Impact=调大更紧但易抖。
    track_clockwise_entry_arc_angular: 1.27
    # What=顺时针入口提前出弯角；Why=补偿惯性；Range=15-55deg；Impact=调大更早切直线。
    track_clockwise_entry_arc_exit_lead_deg: 15.0
    # What=顺时针左弯线速；Why=按左弯实测；Range=0.30-0.75m/s；Impact=调大压墙风险增大。
    track_clockwise_left_side_arc_linear: 0.70
    # What=顺时针左弯角速；Why=按左弯半径；Range=0.8-1.6rad/s；Impact=调大更贴内侧。
    track_clockwise_left_side_arc_angular: 1.25
    # What=顺时针左弯提前出弯角；Why=防过转；Range=15-55deg；Impact=调大欠转，调小过转。
    track_clockwise_left_side_arc_exit_lead_deg: 43.0
    # What=顺时针右弯线速；Why=按右弯实测；Range=0.30-0.75m/s；Impact=调大横向余量变小。
    track_clockwise_right_side_arc_linear: 0.70
    # What=顺时针右弯角速；Why=按右弯半径；Range=0.8-1.6rad/s；Impact=调大转向更紧。
    track_clockwise_right_side_arc_angular: 1.25
    # What=顺时针右弯提前出弯角；Why=防过转；Range=15-55deg；Impact=调大更早切直线。
    track_clockwise_right_side_arc_exit_lead_deg: 40.0
    # What=顺时针出口弯线速；Why=交接前保守；Range=0.30-0.65m/s；Impact=调大交接位置误差增大。
    track_clockwise_exit_turn_90_linear: 0.50
    # What=顺时针出口弯角速；Why=对齐交接直线；Range=0.8-1.6rad/s；Impact=调大易过冲。
    track_clockwise_exit_turn_90_angular: 1.25
    # What=顺时针出口提前出弯角；Why=确保交接航向；Range=15-55deg；Impact=调大可能未到位。
    track_clockwise_exit_turn_90_exit_lead_deg: 30.0
    # 两个 180deg 弯的触发保护与中间直线长度。
    # What: *_turn_force_min/max_map_x 是名义 IMU 转角未及时确认时允许强制切入下一弯的 map X 窗口；*_medium_distance_m 是对应中间直线的里程长度。
    # Why: 正常入弯由 IMU 段状态触发，map X 只作场地固定位置的兜底，防止漏触发导致一直跑直线。
    # Range: 强制窗口必须由实测 map X 标定并包住目标弯点约 +-0.2-0.5m；中间直线 0.35-1.00m。
    # Impact: 窗口前移/加宽会更早强制转弯，可能在 IMU 尚未到位时切弯；后移/变窄更依赖 IMU，漏触发风险更高。不要把它作为常规转弯时机。
    # track_counterclockwise_turn_force_min_map_x: 逆时针 180deg 兜底窗口下界；Why=防漏触发；Range=目标弯点前 0.2-0.5m；Impact=调小会过早强制转弯。
    track_counterclockwise_turn_force_min_map_x: 1.45
    # track_counterclockwise_turn_force_max_map_x: 逆时针兜底窗口上界；Why=限制强制转弯最晚位置；Range=覆盖目标弯点后 0.2-0.5m；Impact=调大可能直线跑过弯点。
    track_counterclockwise_turn_force_max_map_x: 4.20
    # track_counterclockwise_exit_medium_distance_m: 逆时针出口中段长度；Why=决定下一段弯的里程触发；Range=0.35-1.00m；Impact=调大下一弯更晚。
    track_counterclockwise_exit_medium_distance_m: 0.67
    # track_clockwise_turn_force_min_map_x: 顺时针 180deg 兜底窗口下界；Why=防漏触发；Range=目标弯点前 0.2-0.5m；Impact=调小会过早强制转弯。
    track_clockwise_turn_force_min_map_x: 1.30
    # track_clockwise_turn_force_max_map_x: 顺时针兜底窗口上界；Why=限制强制转弯最晚位置；Range=覆盖目标弯点后 0.2-0.5m；Impact=调大可能跑过弯点。
    track_clockwise_turn_force_max_map_x: 3.80
    # track_clockwise_exit_medium_distance_m: 顺时针出口中段长度；Why=决定下一段弯的里程触发；Range=0.35-1.00m；Impact=调大下一弯更晚。
    track_clockwise_exit_medium_distance_m: 0.54
    # What: track_entry_medium_distance_m、track_top_long_distance_m、track_exit_medium_distance_m 是各直线段按 XY 位移累计的切段距离。
    # Why: 这些距离把相邻转弯隔开，必须与赛道实测长度一致。
    # Range: 每段以实测值为中心调整 +-0.20m，先修正入口锚点再修改距离。
    # Impact: 数值增大使下一弯更晚触发，减小更早触发；误调会把所有后续弯点整体推移。
    # track_entry_medium_distance_m: 入口直线到首弯的距离；Why=匹配赛道实测长度；Range=实测值 +-0.20m；Impact=调大首弯更晚，调小更早。
    track_entry_medium_distance_m: 0.65
    track_entry_boundary_trigger_enabled: false
    track_entry_boundary_guard_half_width_m: 0.50
    track_entry_boundary_top_y_ratio: 0.20
    track_entry_boundary_max_angle_deg: 20.0
    track_entry_boundary_confirm_frames: 1
    track_top_boundary_trigger_enabled: false
    track_top_boundary_guard_half_width_m: 0.50
    track_top_boundary_top_y_ratio: 0.20
    track_top_boundary_max_angle_deg: 20.0
    track_top_boundary_confirm_frames: 1
    # 边界视觉触发为可选兜底；生产仍以 IMU 段状态与 map-X 强制窗口为主。
    track_side_arc_vision_trigger_lead_m: 0.20
    track_side_arc_vision_trigger_speed_mps: 0.45
    # track_turn_force_map_x_enabled: 是否启用 map X 强制转弯兜底；Why=防 IMU 段确认丢失；Range=true/false；Impact=false 完全依赖 IMU，漏触发会继续直行。
    track_turn_force_map_x_enabled: true
    # track_turn_force_min_map_x: 通用强制转弯窗口下界；Why=限定固定坐标触发起点；Range=目标弯点前 0.2-0.5m；Impact=调小可能提前转弯。
    track_turn_force_min_map_x: 1.60
    # track_turn_force_max_map_x: 通用强制转弯窗口上界；Why=限定固定坐标触发终点；Range=目标弯点后 0.2-0.5m；Impact=调大可能越过弯点后才转。
    track_turn_force_max_map_x: 3.65
    # S1 -> S2 与 S2 -> S3 交接。
    # What: stage2_entry_pose_max_age_sec 限制入口锚点诊断年龄；track_stage3_handoff_map_y 是 S2 发布 stage3_entry_anchor 的 map Y 门线。
    # Why: S1 交接锚点建立 S2 的 track X；S2 到 y=2.70m 后保持最后非零命令，等待 S3 连续接管，避免正常交接停车。
    # Range: handoff_map_y 按实测门线调整 +-0.20m。入口年龄参数通常不调，它只记录诊断，不单独拒绝锚点。
    # Impact: handoff_y 提前会缩短 S2 末段但把位置误差带给 S3；推后可能越过 S3 搜索起点。S2 会持续保持末段命令，真实接管超时仅由 Supervisor 判定。
    stage2_entry_pose_topic: stage2_entry_pose
    stage2_entry_pose_max_age_sec: 2.0
    # track_top_long_distance_m: 顶部长直线长度；Why=决定右侧 180deg 弯入口；Range=实测值 +-0.20m；Impact=调大右弯更晚，调小更早。
    track_top_long_distance_m: 2.47
    # track_exit_medium_distance_m: 出口 90deg 弯前中段长度；Why=匹配交接前直线；Range=0.35-1.00m；Impact=调大出口弯更晚。
    track_exit_medium_distance_m: 0.60
    # track_stage3_handoff_map_y: S2 发布 stage3_entry_anchor 的 map Y 门线；Why=让 S3 从确定位置预热接管；Range=实测门线 +-0.20m；Impact=调大交权更晚，调小可能过早把位置误差交给 S3。
    track_stage3_handoff_map_y: 2.85
    stage3_entry_anchor_topic: stage3_entry_anchor
    stage3_entry_anchor_base_frame: base_footprint
    stage3_preplan_pose_topic: stage3_preplan_pose
    stage3_preplan_map_y: 1.80
    # 直线视觉/位移融合回正。
    # What: IMU 负责直线航向；视觉只在近场中线连续稳定后给出横向回正，远场和相对横偏只作诊断。
    # Why: 相对横偏由轮速和 IMU 航向积分得到，出弯残余航向会使它和透视误差同向，不能作为视觉可信度或增益来源。
    # Impact: confirm_frames 与 max_frame_delta 拦截瞬态分割跳变；lateral_deadband 控制静区，max_angular 保留硬上限。
    track_line_heading_kp: 0.80
    track_yaw_rate_damping: 0.45
    vision_pure_mode_enabled: false
    vision_primary_control: false
    vision_offset_correction_enabled: true
    vision_length_correction_enabled: false
    vision_turn_assist_enabled: false
    imu_heading_correction_enabled: true
    fusion_mode_enabled: true
    track_vision_lateral_scale_m: 0.80
    track_vision_lateral_weight: 0.35
    track_vision_lateral_deadband: 0.12
    track_vision_lateral_release_deadband: 0.08
    # 远近差只作诊断，不直接对直线产生角速度。
    track_vision_heading_gain: 0.0
    track_vision_confirm_frames: 3
    track_vision_max_age_sec: 0.55
    track_vision_max_frame_delta: 0.30
