# ================================================================================
# Stage2 生产配置 — 唯一调参入口
# ================================================================================
# 生产控制器：Stage2TrackController
# 位姿规则：
#   - 距离只用 /odom_combined 相邻 xy 欧氏位移累计
#   - 航向/转角只用 /imu/data 的 yaw
#   - 禁止使用 /odom 或 /odom_combined 的 orientation 做导航角度
#
# 固定段序：
#   entry_arc -> entry_medium -> left_side_arc -> top_long -> right_side_arc
#   -> exit_medium -> exit_turn_90 -> stage3_handoff_line
#
# 调参速查：
#   两个 180° 前触发点：
#     track_side_arc_vision_enabled=true：SEG 优先，map x 兜底
#     track_side_arc_vision_enabled=false：只用 map x；TF 缺失时按距离降级
#   直线速度：track_max_speed
#   弯道速度：track_corner_speed / track_entry_linear
#   弯道转向力度：track_entry_angular / track_corner_angular
#   90° / 180° 弯均按完整相对 IMU 转角和完整弧长结束，无提前收口。
#   出弯反修过猛：track_line_heading_kp / track_yaw_rate_damping
# ================================================================================

stage2_inertial_navigator:
  ros__parameters:

    # ────────────────────────────────────────────────────────────────────────
    # ROS 话题
    # ────────────────────────────────────────────────────────────────────────
    # 赛程阶段话题
    phase_topic: competition_phase
    # 二维码方向任务话题
    task_topic: competition_qr_task
    # 距离里程计话题（仅使用 xy 位移）
    odom_topic: /odom_combined
    # 航向 IMU 话题
    imu_topic: /imu/data
    # Stage1 latched 发布的 map yaw - 原始 IMU yaw 偏置。S2 收到前不启动，
    # 避免把原始 IMU 坐标误当作赛场 map 航向。
    imu_map_yaw_offset_topic: imu_map_yaw_offset
    # 正式比赛必须等待 Stage1 的锁存映射；独立参数测试由 launch 临时开启回退。
    imu_map_yaw_offset_fallback_enabled: false
    imu_map_yaw_offset_fallback_map_yaw_deg: 90.0
    # 激光扫描话题
    scan_topic: /scan
    # Stage2 速度输出话题
    cmd_topic: /stage2_cmd_vel
    # 阶段反馈话题
    feedback_topic: competition_feedback
    # 阶段状态话题
    state_topic: stage2_state
    # 是否启用长直道图像采集
    stage2_ai_capture_enabled: true
    # 距离末端多少米时触发图像采集
    stage2_ai_capture_lead_m: 0.50
    # 图像采集触发话题
    stage2_ai_trigger_topic: stage2_ai_capture

    # ────────────────────────────────────────────────────────────────────────
    # 启动 / 循环
    # ────────────────────────────────────────────────────────────────────────
    # 主控制循环频率（Hz）
    control_rate_hz: 20.0
    # 控制循环/命令发布间隔超过该阈值时写 CTRL_GAP 诊断日志。
    control_gap_warn_sec: 0.35
    # 速度命令超过该时长未由控制循环刷新时，心跳临时发布零速度；控制循环恢复后继续当前段。
    # 与告警阈值分开，避免偶发 0.35s 级调度抖动误停。
    control_gap_stop_sec: 1.00
    # 速度指令心跳频率（Hz）
    command_heartbeat_rate_hz: 20.0
    # QR 任务到达后、进入 Phase2 前预加载 SEG 模型，避免切换时抢占控制循环。
    stage2_vision_prewarm_on_task: true
    # Stage1 发布 phase=2 后立即启动 Stage2；不再额外等待 0.5s。
    start_delay_sec: 0.0
    # 启动时允许的静止线速度阈值（m/s）
    start_stationary_speed_mps: 0.03
    # 启动时允许的静止角速度阈值（rad/s）
    start_stationary_yaw_rate_rps: 0.08
    # 只检查当前底盘是否仍在明显运动；不再要求连续静止保持 0.5s。
    start_stationary_hold_sec: 0.0
    # 阶段反馈日志前缀
    test_feedback_prefix: 第二阶段

    # 生产定位源：距离使用 /odom_combined，角度使用 IMU。
    # 导航距离位姿源；航向始终使用 IMU
    navigation_pose_source: ekf
    # 轮速里程计话题（仅用于启动诊断/预热）
    wheel_odom_topic: /odom
    # 轮速里程计预热时间（s）
    wheel_odom_warmup_sec: 0.40
    # 轮速里程计预热最少消息数
    wheel_odom_warmup_min_msgs: 5

    # ────────────────────────────────────────────────────────────────────────
    # 生产轨迹参数
    # ────────────────────────────────────────────────────────────────────────
    # 直线速度：entry_medium / top_long / exit_medium / stage3_handoff_line
    # 直线段最大线速度（m/s）
    track_max_speed: 0.66

    # 全局角速度限幅
    # 全局最大角速度（rad/s）
    track_max_angular: 1.5

    # 入口 90° 弯：线速度 + 角速度
    # 0.50 / 1.25 = 0.40m，与入口/出口 90° 弯半径一致。
    track_entry_linear: 0.50
    track_entry_angular: 1.25

    # 后续 180° 弯：线速度 + 角速度上限
    # 180° 弯直径约 0.50m，即 R=0.25m；0.35 / 1.40 = 0.25m。
    track_corner_speed: 0.35
    track_corner_angular: 1.5

    # 第一个 180° 的标定中心：entry_arc 后 entry_medium 的名义距离。
    # 视觉触发开启后，此值不再是常规切段点，而是下方保护窗口的中心。
    track_entry_medium_distance_m: 0.65

    # 第一个 180° 的名义里程终点；视觉触发窗口见下方统一配置。
    track_entry_boundary_trigger_enabled: true
    track_entry_boundary_guard_half_width_m: 0.50 # 让纯视觉
    # 前方横边在分割 ROI 中自顶部向下的位置比例；值越大代表边界越靠近车头。
    track_entry_boundary_top_y_ratio: 0.20
    # 只接受近似水平、正对车头的横向边界。
    track_entry_boundary_max_angle_deg: 20.0
    # 连续有效视觉帧数；现场试跑先用 1，支持改为 2 或 3 抑制误检。
    track_entry_boundary_confirm_frames: 1

    # 第二个 180°：复用第一个弯的 SEG 横边判定，独立保留调参入口。
    track_top_boundary_trigger_enabled: true
    track_top_boundary_guard_half_width_m: 0.50
    track_top_boundary_top_y_ratio: 0.20
    track_top_boundary_max_angle_deg: 20.0
    track_top_boundary_confirm_frames: 1

    # 两个 180° 弯的总视觉开关。SEG 横边仅能在名义终点前
    # track_side_arc_vision_trigger_lead_m 的窗口内切段；进入窗口即降至
    # track_side_arc_vision_trigger_speed_mps，以稳定边界检测。
    # track_turn_force_map_x_enabled 仍独立控制 TF x 与 TF 缺失后的距离降级策略。
    track_side_arc_vision_enabled: true
    track_side_arc_vision_trigger_lead_m: 0.20
    track_side_arc_vision_trigger_speed_mps: 0.45

    # 两个 180° 的视觉均未确认时，以 map <- base_footprint 的 x 强制转弯。
    # 顺时针：entry_medium x<=min，top_long x>=max；逆时针顺序相反。
    # map TF 暂不可用时才回退到各段距离窗口上限，避免无限直行。
    track_turn_force_map_x_enabled: true
    track_turn_force_min_map_x: 2.03
    track_turn_force_max_map_x: 4.10

    # 第二个 180° 的名义里程中心，只用于视觉有效窗口和 TF 缺失保护。
    track_top_long_distance_m: 2.47

    # 出口最后直线长度：right_side_arc 后走多远判定 Stage2 完成。
    # 最新实车反馈最后一段偏长，缩短 20cm：1.49m -> 1.29m。
    track_exit_medium_distance_m: 0.80

    # 两个 180° 和出口短直线完成后，按方向执行 90°：顺时针左转、逆时针右转。
    # 该段复用入口 90° 的 track_entry_linear / track_entry_angular / radius 配置，
    # 随后沿 -Y 直行；实时 TF map_y 严格小于此值时交权给 Stage3。
    track_stage3_handoff_map_y: 2.30
    stage3_entry_anchor_topic: stage3_entry_anchor
    # S3 交接锚点只取 map <- base_footprint 的实时 TF xy；TF 不可用时暂停交权。
    stage3_entry_anchor_base_frame: base_footprint
    # S2 末段 x 固定；进入最后 -Y 直线即把该 x 和预测起点 y 交给 S3 后台 A*。
    stage3_preplan_pose_topic: stage3_preplan_pose
    stage3_preplan_map_y: 1.80
    # 正式交权后持续末段命令的最长时间；S3 未及时接管则安全停车。
    stage3_handoff_hold_timeout_sec: 1.0

    # 名义半径：两个 180° 弯直径约 0.50m。控制器以 v/R 生成基准角速度，
    # 并以 πR 作为弧长参考；入口/出口 90° 弯仍使用 track_entry_radius。
    track_entry_radius: 0.40
    track_corner_radius: 0.25

    # 四个弯以完整弧长和完整 IMU 转角为目标。末段的允许角速度按
    # sqrt(2 * decel * remaining_angle) 实时计算，角速度越高越早制动；
    # 没有固定提前角。只有目标转角和 IMU yaw-rate 均收敛才切直线。
    track_arc_yaw_decel_rps2: 2.0
    track_arc_yaw_rate_kp: 0.60
    track_arc_terminal_yaw_rate_rps: 0.15
    track_arc_terminal_angle_deg: 0.75
    # 终点反向曲率校正时保持阿克曼底盘可转向的最低正向速度。
    track_arc_terminal_min_speed_mps: 0.08

    # 直线段出弯修正
    track_line_heading_kp: 0.80
    track_yaw_rate_damping: 0.45

    # 视觉横向辅助：只在 LINE 段小幅纠偏，不接管主控
    vision_pure_mode_enabled: false
    vision_primary_control: false
    vision_offset_correction_enabled: true
    vision_length_correction_enabled: false
    vision_turn_assist_enabled: false
    imu_heading_correction_enabled: true
    fusion_mode_enabled: true
    # 长直线视觉纠偏：近场中线负责横移拉回，远近差负责航向辅助。
    # 保留 0.40rad/s 的强回正能力，但仅在连续可信且近远中线不矛盾时释放。
    track_vision_lateral_scale_m: 2.40
    track_vision_lateral_weight: 0.35
    track_vision_lateral_deadband: 0.06
    track_vision_lateral_release_deadband: 0.035
    track_vision_heading_gain: 0.22
    # 横偏纠正必须在首张可信 SEG 帧生效，避免出弯残余角速度已造成横移后才介入。
    track_vision_confirm_frames: 1
    # SEG 实测约 2~3Hz；必须覆盖相邻推理帧间隔，否则确认计数会在下一帧前被清零。
    track_vision_max_age_sec: 0.60
    track_vision_max_frame_delta: 0.25
    track_vision_opposition_threshold: 0.08
    # 车体物理居中、静止时记录 near_error，填入这里以消除相机安装零偏。
    track_vision_camera_offset: 0.0
    # 每个新 SEG 帧允许的视觉角速度变化；不是最大角速度限幅。
    track_vision_max_angular_step: 0.12
    # 视觉修正本身保留 ±0.40rad/s，总输出仍受 track_max_angular=0.75rad/s 限制。
    track_vision_correction_max_angular: 0.40

    # /odom_combined 单步异常过滤，防 EKF 跳变误累计距离。
    # 这不是限速参数，只是“单次里程跳变是否计入”的阈值。
    # 最新日志里 top_long 后半段 /odom_combined 单步超过 0.12m 被连续丢弃，
    # 导致 seg_s 卡在 2.07/2.59m，right_side_arc 没有触发。
    # 0.40m 可覆盖 0.50m/s 高速直线下的低频/抖动里程更新，同时仍过滤明显跳变。
    track_odom_combined_step_max_m: 0.40

    # ────────────────────────────────────────────────────────────────────────
    # 雷达安全停车 / 避障
    # ────────────────────────────────────────────────────────────────────────
    # 生产轨迹中关闭 front_obstacle 硬停车，避免圆弧扫边误触发 SAFE_STOP。
    # 0.0 表示关闭；圆弧按 IMU/里程连续执行。
    turn_obstacle_stop_m: 0.0

    # 直线段避障触发阈值
    detour_enabled: true
    detour_obstacle_distance: 0.52
    detour_front_angle_deg: 15.0
    detour_side_center_deg: 65.0
    detour_side_window_deg: 30.0
    detour_min_side_clearance: 0.18

    # 避障动作参数
    avoid_turn_away_deg: 30.0
    avoid_turn_back_deg: 40.0
    avoid_recover_deg: 40.0
    avoid_leg1_distance_m: 0.22
    avoid_leg2_distance_m: 0.22
    avoid_leg_linear_speed: 0.10
    avoid_turn_linear_speed: 0.08
    avoid_turn_angular_speed: 0.40
    avoid_leg_distance_tol_m: 0.04
    side_detour_threshold_m: 0.18
    avoider_heading_tolerance_deg: 1.5

    # 生产直线避障：在左右围栏约束内提前完成小横移，整个过程保持直线速度。
    # 无法从扫描中得到两侧围栏，或障碍两侧均不足车体包络时，不创建绕行计划。
    stage2_straight_avoid_enabled: true
    stage2_straight_avoid_trigger_m: 1.50
    stage2_straight_avoid_window_min_x: 0.18
    stage2_straight_avoid_window_half_width_m: 0.22
    # 只接受车头正前方 +/-15 度的障碍；赛道两侧围栏不触发绕行。
    stage2_straight_avoid_front_angle_deg: 15.0
    stage2_straight_avoid_cluster_gap_m: 0.12
    stage2_straight_avoid_min_cluster_points: 3
    stage2_straight_avoid_min_cluster_width_m: 0.06
    stage2_straight_avoid_max_cluster_width_m: 0.55
    stage2_straight_avoid_min_valid_range_m: 0.15
    # 聚类先通过横向尺寸过滤，再需连续关联 3 帧才允许启动横移。
    # association_* 是相邻扫描中同一目标允许的位置/尺寸变化。
    stage2_straight_avoid_min_lateral_span_m: 0.05
    stage2_straight_avoid_confirm_frames: 3
    stage2_straight_avoid_association_x_m: 0.25
    stage2_straight_avoid_association_y_m: 0.12
    stage2_straight_avoid_association_span_m: 0.20
    # 一次 S 形横移完成后短暂忽略旧回波，避免围栏或同一物体立即二次触发。
    stage2_straight_avoid_cooldown_sec: 1.00
    # 当前直线速度保持不变；speed_limit=0.0 表示不限速。
    stage2_straight_avoid_speed_limit_mps: 0.0
    stage2_straight_avoid_angular_speed: 0.80
    # 根据扫描可行横移反算的最大偏航；不是固定打角。
    stage2_straight_avoid_yaw_offset_deg: 30.0
    stage2_straight_avoid_yaw_tolerance_deg: 1.0
    # 仅在车头已贴近直线基准时触发；每个子转向超过此角度立即退出避障。
    stage2_straight_avoid_start_heading_tolerance_deg: 15.0
    stage2_straight_avoid_max_turn_travel_deg: 35.0
    # 围栏内缘估计窗口，以及车辆/障碍的保守安全包络。
    stage2_straight_avoid_corridor_min_x_m: 0.20
    stage2_straight_avoid_corridor_min_lateral_m: 0.28
    stage2_straight_avoid_vehicle_half_width_m: 0.15
    stage2_straight_avoid_clearance_m: 0.07
    # 最小有效横移；完整换线必须在障碍前额外保留的纵向余量。
    stage2_straight_avoid_min_shift_m: 0.06
    stage2_straight_avoid_forward_margin_m: 0.25

    # 两个 180° 弯前探测：仅记录，不停车、不减速、不改变切段。
    # 顺时针取右侧、逆时针取左侧；前方与同侧窗口共用上述聚类过滤规则。
    stage2_turn_precheck_enabled: true
    stage2_turn_precheck_lead_m: 0.60
    stage2_turn_precheck_front_m: 0.50
    stage2_turn_precheck_side_m: 0.60
    stage2_turn_precheck_side_min_x_m: 0.0
    stage2_turn_precheck_side_min_y_m: 0.18

    # ────────────────────────────────────────────────────────────────────────
    # 视觉模型 / 日志
    # ────────────────────────────────────────────────────────────────────────
    vision_model_path: /home/sunrise/dev_ws/src/racing/racing_stage2/models/bset.bin
    vision_conf_thres: 0.25
    vision_iou_thres: 0.45
    vision_crop_ratio: 0.60
    vision_crop_side_ratio: 0.05
    vision_http_port: 8082

    session_log_subdir: competition_stage2
    session_log_filename: latest.log
    session_telemetry_interval_sec: 0.50
