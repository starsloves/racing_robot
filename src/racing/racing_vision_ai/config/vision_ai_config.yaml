# Vision AI Configuration File
# 火山引擎配置
volcengine:
  # API密钥 - 请替换为你的实际API密钥
  # Keep credentials out of the repository. Export ARK_API_KEY on the robot.
  api_key: ""
  
  # 模型ID - 可用 ARK_MODEL_ID 环境变量覆盖
  model_id: "doubao-seed-1-6-250615"
  
  # AI分析提示词
  prompt: "请用一小段话简单述这张图片中的内容，包括物体、场景、颜色等信息。"

# 检测配置
detection:
  # 触发图像分析的sign值
  target_sign: 9
  
  # 图像话题名称
  image_topic: "/aurora/rgb/image_raw"
  
  # sign话题名称  
  sign_topic: "sign4return"

# 图像处理配置
image:
  # 图像质量 (1-100)
  jpeg_quality: 85
  
  # 图像格式
  format: "JPEG"
