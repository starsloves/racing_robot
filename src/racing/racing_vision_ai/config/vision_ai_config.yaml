# Stage2 图生文配置。三路模型并发请求，默认等待完整结果一次性播报。
# 所有图生文参数直接从本文件读取。

vision_models:
  ark:
    enabled: true
    provider: ark
    base_url: "https://ark.cn-beijing.volces.com/api/v3/chat/completions"
    api_key: ""
    api_key_env: "ark-api-key"
    model_id: "doubao-seed-2-0-mini-260428"
    thinking_enabled: false
    prompt: "仅简要描述画面中展示牌上的图案和关键信息，忽略背景、赛道和其他物体，只需要描述在做什么。用20-30个汉字输出适合语音播报的中文短句"
    timeout_sec: 30
    max_tokens: 48

  qwen:
    enabled: true
    provider: dashscope
    base_url: "https://dashscope.aliyuncs.com/compatible-mode/v1/chat/completions"
    api_key: ""
    api_key_env: "qwen-api-key"
    model_id: "qwen3.7-plus"
    thinking_enabled: false
    prompt: "仅简要描述画面中展示牌上的图案和关键信息，忽略背景、赛道和其他物体，只需要描述在做什么。用20-30个汉字输出适合语音播报的中文短句"
    timeout_sec: 30
    max_tokens: 48

  local:
    enabled: true
    provider: openai_compatible
    base_url: "http://127.0.0.1:8080/v1/chat/completions"
    api_key: ""
    model_id: "SmolVLM-256M-Instruct"
    prompt: "仅简要描述画面中展示牌上的图案和关键信息，忽略背景、赛道和其他物体，只需要描述在做什么。用10-20个汉字输出适合语音播报的中文短句"
    # 0 表示本地 HTTP 推理及竞速首字等待均不超时；云端不可用时持续等待本地结果。
    timeout_sec: 0
    max_tokens: 48
    require_chinese: true
    manage_process: true
    server_path: "/home/sunrise/models/llama.cpp/build/bin/llama-server"
    model_path: "/home/sunrise/models/SmolVLM-256M-Instruct-Q8_0.gguf"
    mmproj_path: "/home/sunrise/models/mmproj-SmolVLM-256M-Instruct-f16.gguf"
    host: "127.0.0.1"
    port: 8080
    threads: 4
    context_size: 2048
    warmup_timeout_sec: 25
    # 节点启动即加载模型；二维码任务到达时再做一次小图视觉预填充，
    # 避免在展示牌抓拍时才首次加载模型或视觉编码器。
    server_prewarm_on_startup: true
    image_warmup_on_task: true
    image_warmup_enabled: true
    image_warmup_max_edge_px: 96
    image_warmup_frame_wait_sec: 8.0
    # Cortex-A55 的首次视觉 prefill 约需 20 秒，必须等它真正完成；
    # 否则服务端仍在处理该请求，正式抓拍反而会被排队。
    image_warmup_request_timeout_sec: 45.0
    image_warmup_max_tokens: 1
    # 由节点运行时按 RACING_SESSION_ROOT/stage2/ 解析，此字段已不再生效（保留占位）。
    log_path: "/home/sunrise/dev_ws/log/stage2/local-smolvlm.log"

response:
  # false: 等模型完整生成后一次性播报；true: 按首个有效流式短句播报。
  streaming_enabled: false
  max_description_chars: 40

image:
  jpeg_quality: 85
  max_edge_px: 448
  # 只裁掉画面顶部的小部分，完整保留左右和下方赛道/展示牌区域。
  crop_top_ratio: 0.10

capture:
  # 由节点运行时按 RACING_SESSION_ROOT/stage2/ 解析，此字段已不再生效（保留占位）。
  save_path: "/home/sunrise/dev_ws/log/stage2/ai_capture.jpg"
