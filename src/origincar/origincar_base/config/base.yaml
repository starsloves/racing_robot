/**:
  ros__parameters:
    # MPU6050 raw gyro conversion. 0.00026644 is the +/-500 deg/s scale.
    imu_gyro_scale_rad_s_per_lsb: 0.00026644
    # MPU6050 +/-2g conversion: 16384 LSB/g / 9.80665 m/s2/g.
    imu_accel_scale_lsb_per_mps2: 1671.84
    imu_gyro_bias_z_rad_s: 0.0
    # Firmware velocity fields are signed mm/s.
    odom_velocity_scale_mps_per_lsb: 0.001
    odom_world_x_scale: 0.926
    odom_world_y_scale: 1.0
    odom_max_integration_dt_sec: 0.25
    # Commands are capped at 0.8m/s; reject corrupt serial wheel fields before EKF fusion.
    odom_max_valid_speed_mps: 1.20
    # Avoid a blocking empty UART read while a /cmd_vel callback needs the same port.
    serial_idle_sleep_ms: 1
    voltage_scale_v_per_lsb: 0.001
    # Calibrate z-axis bias only while the command and lower-level velocities
    # are both stationary. The competition supervisor keeps the chassis still
    # during startup, so this does not require a separate calibration motion.
    imu_gyro_auto_calibration_enabled: true
    imu_gyro_calibration_samples: 60
    imu_gyro_calibration_max_speed_mps: 0.02
    imu_gyro_calibration_max_yaw_rate_rad_s: 0.04
